  const b = document.createElement('div');
  const topics = Cards.RANDOM_TOPICS;
  const idents = [].concat(Cards.RANDOM_IDENTS[0], Cards.RANDOM_IDENTS[1]);
  b.innerHTML = (mode === 'random' ? `
    <div class="frm-row"><label>题材</label>
      <select class="ipt sel" id="cgTopic">
        <option value="">纯随机</option>
        ${topics.map(t => `<option value="${t}" ${preset.topic === t ? 'selected' : ''}>${t}</option>`).join('')}
      </select></div>
    <div class="frm-row"><label>职业/身份</label>
      <select class="ipt sel" id="cgIdent">
        <option value="">纯随机</option>
        ${idents.map(t => `<option value="${t}" ${preset.ident === t ? 'selected' : ''}>${t}</option>`).join('')}
      </select></div>
    <p class="hint">会从上到下组合出一张完整角色卡，可再编辑微调。</p>` : `
    <div class="frm-row"><label>题材</label>
      <select class="ipt sel" id="cgTopic">
        <option value="">不限</option>
        ${topics.map(t => `<option value="${t}">${t}</option>`).join('')}
      </select></div>
    <div class="frm-row"><label>一句话描述</label>
      <textarea class="ipt" id="cgHint" rows="3" placeholder="例如：痞气却重义的星际走私船长，厌倦了亡命，想金盆洗手却被人盯上。"></textarea></div>
    <p class="hint">AI 会按描述扩成一张完整角色卡；无 API Key 时用内置模板随机。</p>`);
  const sel = modal({ title: mode === 'random' ? '🎲 随机生成角色卡' : '✍️ 一句话生成角色卡', body: b, wide: true, foot: false });
  const foot = document.createElement('div'); foot.className = 'btn-row pad';
  foot.innerHTML = `<button class="btn ghost" id="cgCancel">取消</button><button class="btn primary" id="cgGen">生成</button>`;
  b.appendChild(foot);
  $('#cgCancel', foot).onclick = () => sel.close();
  $('#cgGen', foot).onclick = async () => {
    const topic = $('#cgTopic', b).value;
    const ident = $('#cgIdent', b) ? $('#cgIdent', b).value : '';
    const hint = $('#cgHint', b) ? $('#cgHint', b).value.trim() : '';
    const ctx = await ensureReady();
    const btn = $('#cgGen', foot); btn.disabled = true; btn.textContent = '生成中…';
    try {
      const card = await Cards.aiGenerate(hint || null, topic, ident, ctx);
      // 让用户先看到/编辑保存
      sel.close();
      openCardEditor(card, done);
    } catch (e) { toast('生成失败：' + e.message, 'err', 5000); }
    finally { btn.disabled = false; btn.textContent = '生成'; }
  };
}

function exportCard(card) {
  download(`角色卡-${(card.name || '未命名').replace(/[\\/:*?"<>|]/g, '_')}.json`, JSON.stringify({ app: 'weaver-card', version: 1, card }, null, 2));
  toast('已导出角色卡', 'ok');
}
function importCard() {
  /* 通过隐藏 input 导入 */
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      const c = d.card || d;
      const data = Cards.blanks();
      ['name','title','age','gender','job','looks','persona','flaw','backstory','speaking','world','userRole','opening','tags'].forEach(k => { data[k] = c[k] || data[k]; });
      if (!data.name) throw new Error('缺少姓名');
      await CARDS.put(data);
      toast('🎭 已导入角色卡', 'ok');
      openCardLibrary();
    } catch (e) { toast('导入失败：' + e.message, 'err', 5000); }
  };
  inp.click();
}

/* ================= 设置面板 ================= */
function openSettings(tab) {
  const tabs = [['外观', 'look'], ['默认参数', 'params'], ['总结与记忆', 'mem'], ['API 接口', 'api'], ['安全与数据', 'sec'], ['关于', 'about']];
  const m = modal({ title: '⚙️ 设置', wide: true, foot: false, body: document.createElement('div') });
  const root = m.body;
  root.innerHTML = `<div class="set-tabs">${tabs.map(([n, k]) => `<button data-t="${k}" class="${k === tab ? 'on' : ''}">${n}</button>`).join('')}</div><div class="set-body"></div>`;
  const body = $('.set-body', root);
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-t]'); if (!b) return;
    $$('.set-tabs button', root).forEach(x => x.classList.toggle('on', x === b));
    renderTab(b.dataset.t);
  });

  function renderTab(t) {
    body.innerHTML = '';
    if (t === 'look') renderLook();
    else if (t === 'params') renderParams();
    else if (t === 'mem') renderMem();
    else if (t === 'api') renderApi();
    else if (t === 'sec') renderSec();
    else if (t === 'about') renderAbout();
  }

  /* --- 外观 --- */
  function renderLook() {
    body.innerHTML = `
      <div class="frm-row"><label>主题</label><select class="ipt sel" id="stTheme">
        <option value="auto" ${S.settings.theme === 'auto' ? 'selected' : ''}>跟随系统</option>
        <option value="dark" ${S.settings.theme === 'dark' ? 'selected' : ''}>深色</option>
        <option value="light" ${S.settings.theme === 'light' ? 'selected' : ''}>浅色</option>
      </select></div>
      <div class="frm-row"><label>主题色</label><div class="swatches" id="stAccent">
        ${['#8b5cf6', '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#ec4899'].map(c => `<button class="sw ${c === S.settings.accent ? 'on' : ''}" data-c="${c}" style="--c:${c}"></button>`).join('')}
      </div></div>
      <div class="frm-row"><label>字体大小</label><input type="range" id="stFs" min="13" max="19" step="1" value="${S.settings.fontSize}"></div>
      <div class="frm-row"><label>回车发送</label><span class="switch"><input type="checkbox" id="stEnter" ${S.settings.enterSend ? 'checked' : ''}><i></i></span></div>
      <p class="hint">手机端默认回车换行、用按钮发送；电脑端默认回车发送、Shift+回车换行。</p>`;
    $('#stTheme', body).onchange = e => { S.settings.theme = e.target.value; saveSettings(); applyTheme(); };
    $('#stAccent', body).onclick = e => {
      const b = e.target.closest('.sw'); if (!b) return;
      S.settings.accent = b.dataset.c; saveSettings(); applyTheme();
      $$('.sw', body).forEach(x => x.classList.toggle('on', x === b));
    };
    $('#stFs', body).oninput = e => { S.settings.fontSize = +e.target.value; saveSettings(); applyTheme(); };
    $('#stEnter', body).onchange = e => { S.settings.enterSend = e.target.checked; saveSettings(); };
  }

  /* --- 默认参数 --- */
  function renderParams() {
    body.innerHTML = `<p class="hint">这些是新建对话的默认参数；每个对话可在顶栏「🎛️ 参数」里单独覆盖。</p><div id="stPc"></div>`;
    $('#stPc', body).appendChild(paramControls(S.settings.defaultParams, saveSettings));
  }

  /* --- 总结与记忆 --- */
  function renderMem() {
    body.innerHTML = `
      <div class="frm-row"><label>自动起标题</label><span class="switch"><input type="checkbox" id="stAt" ${S.settings.autoTitle ? 'checked' : ''}><i></i></span></div>
      <p class="hint">首轮对话后由 AI 生成简短对话标题。</p>
      <div class="frm-row"><label>自动剧情总结</label><span class="switch"><input type="checkbox" id="stAs" ${S.settings.autoSummary ? 'checked' : ''}><i></i></span></div>
      <p class="hint">超出上下文窗口的早期内容会被自动总结为「剧情回顾」，随每次对话滚动更新，始终注入上下文。</p>
      <div class="frm-row"><label>自动记忆沉淀</label><span class="switch"><input type="checkbox" id="stAm" ${S.settings.autoMemory ? 'checked' : ''}><i></i></span></div>
      <div class="frm-row"><label>联想注入条数</label><input type="range" id="stMk" min="1" max="12" step="1" value="${S.settings.memoryTopK}"><b id="stMkV" class="pc-val">${S.settings.memoryTopK}</b></div>
      <div class="frm-row"><label>总结触发阈值</label><input type="number" class="ipt num" id="stSd" min="2" max="50" value="${S.settings.summaryMinDropped}"></div>
      <p class="hint">每轮 AI 回复后自动生成一条<strong>短期记忆</strong>；短期/长期满 6 条时自动把最早 2 条合并并升级（短期→长期→永久）。永久记忆始终注入上下文。展开侧栏「🧠 记忆」即可随时查看、编辑、删除、手动合并升级。</p>
      <div class="btn-row"><button class="btn ghost sm" id="stMemOpen">查看当前对话的记忆库</button></div>`;
    $('#stAt', body).onchange = e => { S.settings.autoTitle = e.target.checked; saveSettings(); };
    $('#stAs', body).onchange = e => { S.settings.autoSummary = e.target.checked; saveSettings(); };
    $('#stAm', body).onchange = e => { S.settings.autoMemory = e.target.checked; saveSettings(); };
    $('#stMk', body).oninput = e => { S.settings.memoryTopK = +e.target.value; $('#stMkV', body).textContent = e.target.value; saveSettings(); };
    $('#stSd', body).onchange = e => { S.settings.summaryMinDropped = clamp(+e.target.value || 4, 2, 50); saveSettings(); };
    $('#stMemOpen', body).onclick = () => { m.close(); openSbMemory(true); };
  }

  /* --- API 接口 --- */
  function renderApi() {
    body.innerHTML = `
      <div class="api-list" id="apiList"></div>
      <div class="btn-row"><button class="btn primary" id="apiAdd">＋ 添加接口</button></div>
      <p class="hint">支持 OpenAI 兼容接口（OpenAI / DeepSeek / 智谱 / Kimi / 通义 / OpenRouter / 硅基流动 / Ollama 等）、Anthropic Claude、Google Gemini。API Key 使用 AES-256-GCM 加密存储，界面与备份文件中都不会出现明文。</p>`;
    const list = $('#apiList', body);
    const render = () => {
      list.innerHTML = S.apis.map(a => {
        const st = Vault.keyStatus(a.id);
        const stTxt = a.noKey || a.type === 'demo' ? '' : st === 'none' ? '<span class="kbadge none">未设 Key</span>' : st === 'session' ? '<span class="kbadge sess">仅本会话</span>' : st === 'locked' ? '<span class="kbadge lock">🔒 已加密(锁定)</span>' : '<span class="kbadge ok">🔐 已加密</span>';
        return `<div class="api-card ${a.id === S.activeApiId ? 'on' : ''}" data-id="${a.id}">
          <div class="api-main">
            <b>${esc(a.name)}${a.id === S.activeApiId ? ' <span class="kbadge def">默认</span>' : ''}</b>
            <span class="api-sub">${Providers.typeLabel(a.type)} · ${esc(a.model || a.defaultModel || '默认模型')} ${stTxt}</span>
          </div>
          <div class="api-ops">
            <button class="icon-btn" data-a="use" title="设为默认">✓</button>
            <button class="icon-btn" data-a="edit" title="编辑">✎</button>
            <button class="icon-btn" data-a="del" title="删除">🗑</button>
          </div></div>`;
      }).join('');
    };
    render();
    $('#apiAdd', body).onclick = () => apiEditor(null, render);
    list.onclick = e => {
      const btn = e.target.closest('[data-a]'); if (!btn) return;
      const card = e.target.closest('.api-card'); const api = S.apis.find(a => a.id === card.dataset.id);
      if (!api) return;
      if (btn.dataset.a === 'use') { S.activeApiId = api.id; saveApis(); render(); const s = current(); if (s) { s.apiId = api.id; persistSession(s); renderTopbar(); } toast('已设为默认接口', 'ok'); }
      else if (btn.dataset.a === 'edit') apiEditor(api, render);
      else if (btn.dataset.a === 'del') confirmDialog(`删除接口「${esc(api.name)}」？其保存的 Key 也会一并删除。`, { danger: true, okText: '删除' }).then(async ok => {
        if (!ok) return;
        Vault.removeSecret(api.id);
        S.apis = S.apis.filter(a => a.id !== api.id);
        if (S.activeApiId === api.id) S.activeApiId = S.apis[0] ? S.apis[0].id : null;
        if (!S.apis.length) { S.apis = [{ id: 'demo', name: '演示模式（离线）', type: 'demo', baseURL: '', model: 'demo-story', noKey: true }]; S.activeApiId = 'demo'; }
        saveApis(); render();
        const s = current(); if (s && s.apiId === api.id) { s.apiId = S.activeApiId; persistSession(s); renderTopbar(); }
        toast('已删除', 'ok');
      });
    };
  }

  /* --- API 编辑器 --- */
  function apiEditor(api, done) {
    const isNew = !api;
    const sel = modal({
      title: isNew ? '添加 API 接口' : '编辑接口',
      wide: true, foot: false,
      body: document.createElement('div'),
    });
    const b = sel.body;
    b.innerHTML = `
      <div class="frm-row"><label>预设</label><select class="ipt sel" id="aePreset">
        ${Providers.PRESETS.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}
      </select><i class="pc-hint" id="aeDesc"></i></div>
      <div class="frm-row"><label>名称</label><input class="ipt" id="aeName" placeholder="给接口起个名字"></div>
      <div class="frm-row"><label>Base URL</label><input class="ipt" id="aeUrl" placeholder="https://…/v1"></div>
      <div class="frm-row"><label>默认模型</label><input class="ipt" id="aeModel" list="aeModelList" placeholder="如 gpt-4o-mini"><datalist id="aeModelList"></datalist></div>
      <div class="frm-row" id="aeKeyRow"><label>API Key</label>
        <div class="pc-inline"><input class="ipt" type="password" id="aeKey" placeholder="${esc('')}"><button class="icon-btn" id="aeEye" type="button">👁</button></div>
      </div>
      <div class="frm-row" id="aeSaveRow"><label>保存方式</label>
        <div class="save-opts">
          <label class="rad"><input type="radio" name="aeMode" value="enc" ${Vault.isSetup() && Vault.isUnlocked() && Vault.subtleOK() ? 'checked' : 'disabled'}> 🔐 加密保存</label>
          <label class="rad"><input type="radio" name="aeMode" value="session" ${Vault.isSetup() && Vault.isUnlocked() && Vault.subtleOK() ? '' : 'checked'}> ⏱ 仅本会话</label>
          <label class="rad"><input type="radio" name="aeMode" value="keep" checked> ↩ 沿用已保存的 Key</label>
        </div></div>
      <div class="frm-row"><label>高级：附加请求体 JSON</label><textarea class="ipt" id="aeExtra" rows="2" placeholder='例如 {"top_k":50}，会合并进请求'></textarea></div>
      <div class="btn-row">
        <button class="btn ghost sm" id="aeTest">🔌 测试连接</button>
        <button class="btn danger sm" id="aeDel" style="display:none">删除</button>
      </div>`;
    const P = id => Providers.getPreset(id);
    let curPreset = P(api ? (api.presetId || 'custom') : 'openai') || P('custom');
    $('#aePreset', b).value = api ? (api.presetId || (api.type === 'demo' ? 'demo' : 'custom')) : 'openai';
    function applyPreset() {
      curPreset = P($('#aePreset', b).value) || P('custom');
      $('#aeName', b).value = $('#aeName', b).value || (api ? api.name : curPreset.name);
      if (!api) { $('#aeUrl', b).value = curPreset.baseURL || ''; $('#aeModel', b).value = curPreset.defaultModel || ''; }
      $('#aeDesc', b).textContent = curPreset.desc || (curPreset.models || []).slice(0, 4).join(' / ');
      $('#aeKeyRow', b).style.display = (curPreset.noKey || curPreset.type === 'demo') ? 'none' : '';
      $('#aeSaveRow', b).style.display = (curPreset.noKey || curPreset.type === 'demo') ? 'none' : '';
      $('#aeKey', b).placeholder = curPreset.keyHint || 'sk-…';
      $('#aeModelList', b).innerHTML = (curPreset.models || []).map(x => `<option value="${esc(x)}">`).join('');
    }
    applyPreset();
    if (api) { $('#aeName', b).value = api.name; $('#aeUrl', b).value = api.baseURL || ''; $('#aeModel', b).value = api.model || ''; $('#aeExtra', b).value = api.extraBody || ''; $('#aeDel', b).style.display = ''; }
    $('#aePreset', b).onchange = applyPreset;
    $('#aeEye', b).onclick = () => { const k = $('#aeKey', b); k.type = k.type === 'password' ? 'text' : 'password'; };

    async function collectKey(mode) {
      const keyVal = $('#aeKey', b).value.trim();
      if (mode === 'keep') return;
      if (keyVal) {
        try { await Vault.saveSecret(api ? api.id : newId, keyVal, mode); }
        catch (e) { throw e; }
      }
    }
    let newId = api ? api.id : uid();
    $('#aeTest', b).onclick = async () => {
      const testCfg = {
        id: newId, type: curPreset.type, name: $('#aeName', b).value,
        baseURL: $('#aeUrl', b).value.trim(), model: $('#aeModel', b).value.trim() || curPreset.defaultModel,
        noKey: curPreset.noKey, extraBody: $('#aeExtra', b).value.trim(),
      };
      const btn = $('#aeTest', b); btn.disabled = true; btn.textContent = '测试中…';
      try {
        const key = await Vault.getSecretAsync(newId);
        await Providers.chat(testCfg, key, {
          messages: [{ role: 'user', content: '回复"ok"两个字母即可' }],
          params: { temperature: 0, maxTokens: 16, stream: false, thinking: 'off' },
        });
        toast('✅ 连接成功', 'ok');
      } catch (e) { toast('连接失败：' + e.message, 'err', 6000); }
      finally { btn.disabled = false; btn.textContent = '🔌 测试连接'; }
    };
    $('#aeDel', b).onclick = async () => {
      const ok = await confirmDialog(`删除接口「${esc(api.name)}」？`, { danger: true, okText: '删除' });
      if (!ok) return;
      Vault.removeSecret(api.id);
      S.apis = S.apis.filter(a => a.id !== api.id);
      if (S.activeApiId === api.id) S.activeApiId = S.apis[0] ? S.apis[0].id : null;
      saveApis(); sel.close(); done();
    };
    sel.foot = null;
    const foot = document.createElement('div'); foot.className = 'btn-row pad';
    foot.innerHTML = `<button class="btn ghost" id="aeCancel">取消</button><button class="btn primary" id="aeSave">保存</button>`;
    b.appendChild(foot);
    $('#aeCancel', foot).onclick = () => sel.close();
    $('#aeSave', foot).onclick = async () => {
      const name = $('#aeName', b).value.trim() || curPreset.name;
      const baseURL = $('#aeUrl', b).value.trim();
      const model = $('#aeModel', b).value.trim();
      if (curPreset.type !== 'demo' && !baseURL) { toast('请填写 Base URL', 'warn'); return; }
      const mode = ($('input[name="aeMode"]:checked', b) || {}).value || 'keep';
      try { await collectKey(mode); }
      catch (e) { toast(e.message, 'err'); return; }
      const cfgData = {
        id: newId, presetId: curPreset.id, type: curPreset.type, name,
        baseURL: curPreset.type === 'demo' ? '' : baseURL,
        model: model || curPreset.defaultModel || '',
        noKey: !!curPreset.noKey,
        extraBody: $('#aeExtra', b).value.trim() || null,
      };
      const idx = S.apis.findIndex(a => a.id === newId);
      if (idx >= 0) S.apis[idx] = { ...S.apis[idx], ...cfgData }; else S.apis.push(cfgData);
      if (idx < 0 || !S.activeApiId) { S.activeApiId = newId; }
      saveApis(); sel.close(); done();
      const s = current(); if (s && !s.apiId) { s.apiId = S.activeApiId; }
      renderTopbar(); renderSidebar();
      toast('接口已保存', 'ok');
    };
  }

  /* --- 安全与数据 --- */
  function renderSec() {
    const st = Vault.isSetup() ? (Vault.isUnlocked() ? '已解锁' : '已锁定') : '未设置';
    body.innerHTML = `
      <div class="sec-card">
        <b>🔐 API Key 保险库：${st}</b>
        <p class="hint">主密码经 PBKDF2（310,000 轮）派生 AES-256-GCM 密钥，用于加密所有 API Key。主密码与密钥不落盘，只存在内存；自动锁定/刷新后需重新解锁。忘记主密码将无法取回已保存的 Key（可重置后重录）。</p>
        <div class="btn-row">
          ${Vault.isSetup()
            ? `<button class="btn ghost sm" id="secChange">修改主密码</button><button class="btn ghost sm" id="secLock">立即锁定</button>`
            : `<button class="btn primary sm" id="secSetup">设置主密码</button>`}
        </div>
        <div class="frm-row"><label>自动锁定</label><select class="ipt sel" id="secAuto">
          <option value="0" ${!S.settings.autoLockMin ? 'selected' : ''}>不自动锁定</option>
          ${[1, 5, 15, 30, 60].map(n => `<option value="${n}" ${S.settings.autoLockMin === n ? 'selected' : ''}>${n} 分钟无操作后</option>`).join('')}
        </select></div>
      </div>
      <div class="sec-card">
        <b>📦 数据备份与恢复</b>
        <p class="hint">备份包含全部对话（含分支）、记忆与设置；<b>不包含 API Key</b>（加密密钥不可迁移是安全设计）。</p>
        <div class="btn-row">
          <button class="btn ghost sm" id="secExport">导出全部数据</button>
          <button class="btn ghost sm" id="secImport">导入备份</button>
          <span id="secUsage" class="dim"></span>
        </div>
        <input type="file" id="secFile" accept=".json" style="display:none">
      </div>
      <div class="sec-card danger-zone">
        <b>⚠️ 危险操作</b>
        <div class="btn-row">
          <button class="btn ghost sm" id="secClear">清空所有对话</button>
          <button class="btn danger sm" id="secReset">重置应用（删除一切）</button>
        </div>
      </div>`;

    const setupFlow = async () => {
      const p1 = await promptDialog('设置主密码（至少 4 位，无法找回，请牢记）：', '', { title: '设置主密码' });
      if (p1 === null) return;
      const p2 = await promptDialog('再输入一次确认：', '', { title: '确认主密码' });
      if (p2 === null) return;
      if (p1 !== p2) { toast('两次输入不一致', 'err'); return; }
      try { await Vault.setup(p1); toast('✅ 主密码已设置，此后保存的 Key 都会加密', 'ok'); renderSec(); resetIdle(); }
      catch (e) { toast(e.message, 'err'); }
    };
    const setupBtn = $('#secSetup', body);
    if (setupBtn) setupBtn.onclick = setupFlow;
    const changeBtn = $('#secChange', body);
    if (changeBtn) changeBtn.onclick = async () => {

      const old = await promptDialog('当前主密码：', '', { title: '修改主密码' });
      if (old === null) return;

      if (p2 === null) return;
      if (p1 !== p2) { toast('两次输入不一致', 'err'); return; }

      catch (e) { toast(e.message, 'err'); }
    };
    const lockBtn = $('#secLock', body);
    if (lockBtn) lockBtn.onclick = () => { Vault.lock(); showLock(); };
    $('#secAuto', body).onchange = e => { S.settings.autoLockMin = +e.target.value; saveSettings(); resetIdle(); };
    $('#secExport', body).onclick = async () => {
      const data = { app: 'weaver', version: 1, exportedAt: new Date().toISOString(), settings: S.settings, apis: S.apis, activeApiId: S.activeApiId, sessions: [...S.sessions.values()] };
      download(`织语备份-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(data));

    $('#secImport', body).onclick = () => $('#secFile', body).click();
    $('#secFile', body).onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try {
        const data = JSON.parse(await f.text());
        if (data.app !== 'weaver') throw new Error('不是织语的备份文件');
        let n = 0;
        for (const raw of (data.sessions || [])) {
          if (!raw || !raw.id) continue;
          const s = ensureSession(JSON.parse(JSON.stringify(raw)));
          S.sessions.set(s.id, s);
          await DB.put('sessions', s);
          n++;
        }
        if (data.settings) { S.settings = { ...S.settings, ...data.settings, defaultParams: { ...DEFAULT_PARAMS, ...(data.settings.defaultParams || {}) } }; saveSettings(); applyTheme(); }
        if (Array.isArray(data.apis) && data.apis.length) {
          for (const a of data.apis) if (!S.apis.find(x => x.id === a.id)) S.apis.push(a);
          if (!S.apis.find(x => x.id === S.activeApiId)) S.activeApiId = S.apis[0].id;
          saveApis();
        }
        renderTab('sec'); renderAll();
        toast(`✅ 导入完成：${n} 个对话`, 'ok');
      } catch (err) { Diag.log(err, 'storage', '导入备份文件'); toast('导入失败：' + err.message, 'err', 5000); }
      e.target.value = '';

    DB.usage().then(u => { const el = $('#secUsage', body); if (el && u.quota) el.textContent = `（已用 ${fmtBytes(u.usage)}）`; });
    $('#secClear', body).onclick = async () => {
      const ok = await confirmDialog('删除全部对话？此操作不可恢复。', { danger: true, okText: '全部删除' });
      if (!ok) return;
      await DB.clear('sessions');
      S.sessions.clear();
      newChat();
      toast('已清空全部对话', 'ok');
    };
    $('#secReset', body).onclick = async () => {
      const ok = await confirmDialog('重置应用将删除：<b>全部对话、设置、接口配置与加密密钥库（含所有已保存的 API Key）</b>，且无法恢复。确定继续？', { danger: true, okText: '重置' });
      if (!ok) return;
      const ok2 = await confirmDialog('再次确认：真的要删除一切吗？', { danger: true, okText: '确认重置' });
      if (!ok2) return;
      localStorage.clear();
      try { indexedDB.deleteDatabase('zc-weaver-chat'); } catch (e) {}
      localStorage.removeItem('zc_idbf_sessions'); localStorage.removeItem('zc_idbf_kv');
      location.reload();
    };
  }

/* ================= 上下文占用条 ================= */
function updateCtxBar() {
  const s = current();
  const wrap = $('#ctxWrap');
  if (!s) { wrap.classList.add('hidden'); return; }
  wrap.classList.remove('hidden');
  const p = effParams(s);
  const { usage } = buildPrompt(s);
  const total = usage + (p.maxTokens || 2048);
  const pct = clamp(total / p.contextTokens * 100, 2, 100);
  const fill = $('#ctxFill');
  fill.style.width = pct + '%';
  fill.className = pct > 88 ? 'danger' : pct > 70 ? 'warn' : '';
  $('#ctxHint').textContent = `上下文 ≈${usage} / ${p.contextTokens}`;
}

/* ================= 自动锁定 ================= */
let idleTimer = null;
function resetIdle() {
  if (!S.settings.autoLockMin || !Vault.isSetup()) return;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (Vault.isUnlocked()) { Vault.lock(); showLock(); toast('已自动锁定密钥库', 'warn'); }
  }, S.settings.autoLockMin * 60000);
}

function bind() {
  /* 侧栏 */
  $('#btnNewChat').onclick = () => newChat();
  $('#btnCardLib').onclick = () => openCardLibrary();
  $('#btnCardImport').onclick = importCard;
  $('#searchInput').oninput = U.debounce(e => { S.search = e.target.value; renderSidebar(); }, 150);
  $('#sbTabs').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    $$('#sbTabs button').forEach(x => x.classList.toggle('on', x === b));
    S.filter = b.dataset.filter;
    renderSidebar();
  };
  $('#sessionList').onclick = e => {
    const more = e.target.closest('[data-more]');
    if (more) { e.stopPropagation(); sessionSheet(more.dataset.more); return; }
    const item = e.target.closest('.ss-item');
    if (item) openSession(item.dataset.id);
  };
  $('#btnCloseSb').onclick = closeSidebar;
  $('#btnMenu').onclick = openSidebar;
  $('#backdrop').onclick = closeSidebar;
  $('#btnSettings').onclick = () => openSettings('look');
  $('#btnTheme').onclick = () => {
    S.settings.theme = effectiveTheme() === 'dark' ? 'light' : 'dark';
    saveSettings(); applyTheme();
  };
  $('#btnLock').onclick = () => {
    if (!Vault.isSetup()) { openSettings('sec'); toast('先设置主密码，才能启用加密与锁定', 'info'); return; }
    Vault.lock(); showLock();
  };

  /* 侧边栏记忆区块 */
  $('#sbMemHead').onclick = () => {
    const body = $('#sbMemBody');
    body.hidden = !body.hidden;
    $('#sbMemHead').setAttribute('aria-expanded', String(!body.hidden));
    $$('#sbMem .sb-mem-caret').forEach(c => c.classList.toggle('open', !body.hidden));
    if (!body.hidden) { openMobileSbIfNeeded(); renderSidebarMem(); }
  };
  $('#sbMem .sb-mem-tabs').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    sbMemTab = b.dataset.tab;
    renderSidebarMem();
  };
  async function memRowAction(e) {
    const btn = e.target.closest('[data-mact]'); if (!btn) return;
    const row = e.target.closest('.mem-row'); if (!row) return;
    const s = current(); if (!s) return;
    const mem = memStore(s);
    const arr = sbMemTab === 'stm' ? mem.stm : sbMemTab === 'ltm' ? mem.ltm : mem.pm;
    const item = arr.find(x => x.id === row.dataset.id); if (!item) return;
    const act = btn.dataset.mact;
    if (act === 'del') {
      const ok = await confirmDialog('删除这条' + (sbMemTab === 'stm' ? '短期' : sbMemTab === 'ltm' ? '长期' : '永久') + '记忆？', { danger: true, okText: '删除' });
      if (!ok) return;
      const i = arr.indexOf(item); arr.splice(i, 1);
      if (sbMemTab === 'ltm') mem.ltmTotal = Math.max(0, (mem.ltmTotal || 0) - 1);
    } else if (act === 'pin') { item.pinned = !item.pinned; item.updatedAt = Date.now(); }
    else if (act === 'edit') {
      const v = await promptDialog('修改记忆内容：', item.text, { title: '编辑记忆' });
      if (v && v.trim()) { item.text = v.trim().slice(0, 300); item.keywords = Mem.keywords(item.text, 8); item.updatedAt = Date.now(); }
    }
    await persistSession(s);
    renderSidebarMem(); renderAll();
  }
  $('#sbMemList').onclick = memRowAction;
  $('#sbMemAdd').onclick = async () => {
    const s = current(); if (!s) return;
    const v = await promptDialog('添加一条' + (sbMemTab === 'ltm' ? '长期' : sbMemTab === 'pm' ? '永久' : '短期') + '记忆：', '', { title: '添加记忆' });
    if (!v || !v.trim()) return;
    const mem = memStore(s);
    const arr = sbMemTab === 'stm' ? mem.stm : sbMemTab === 'ltm' ? mem.ltm : mem.pm;
    arr.push(Mem.makeRec(v.trim().slice(0, 300), 2));
    if (sbMemTab === 'ltm') mem.ltmTotal = (mem.ltmTotal || 0) + 1;
    await persistSession(s);
    renderSidebarMem(); renderAll();
    toast('已添加', 'ok');
  };
  $('#sbMemMerge').onclick = async () => {
    const s = current(); if (!s) return;
    const mem = memStore(s);
    if (sbMemTab === 'stm') {
      if (mem.stm.length < 2) { toast('短期记忆至少 2 条才能合并升级', 'warn'); return; }
      const ctx = await ensureReady(); if (!ctx) return;
      await mergeLevel(mem.stm, mem.ltm, '短期记忆', '长期记忆', s, ctx);
      if (mem.ltm.length >= 6) await mergeLevel(mem.ltm, mem.pm, '长期记忆', '永久记忆', s, ctx);
      await persistSession(s);
      renderSidebarMem(); renderAll();
      toast('✅ 短期记忆已合并升级到长期', 'ok');
    } else if (sbMemTab === 'ltm') {
      if (mem.ltm.length < 2) { toast('长期记忆至少 2 条才能合并升为永久', 'warn'); return; }
      const ctx = await ensureReady(); if (!ctx) return;
      await mergeLevel(mem.ltm, mem.pm, '长期记忆', '永久记忆', s, ctx);
      await persistSession(s);
      renderSidebarMem(); renderAll();
      toast('✅ 长期记忆已合并升为永久', 'ok');
    } else {
      toast('永久记忆已是最高级，无法再合并升级', 'info');
    }
  };
  function openMobileSbIfNeeded() { if (isMobileLayout()) openSidebar(); }

  /* 顶栏 */
  $('#chatTitle').onclick = () => { const s = current(); if (s) renameSession(s); };
  $('#btnSessionParams').onclick = openSessionParams;
  $('#btnMemory').onclick = () => openSbMemory(true);
  $('#btnChatMenu').onclick = chatMenuSheet;

  /* 分支栏 */
  $('#branchBar').onclick = e => {
    const s = current(); if (!s) return;
    if (e.target.closest('#btnAddBranch')) { branchFrom(s, null); return; }
    const editBtn = e.target.closest('[data-e]');
    if (editBtn) { e.stopPropagation(); branchSheet(s, editBtn.dataset.e); return; }
    const tab = e.target.closest('[data-b]');
    if (tab) {
      s.activeBranchId = tab.dataset.b;
      persistSession(s);
      renderTopbar(); renderChat(); updateCtxBar();
      S.stickBottom = true;
    }
  };
  const branchManage = e => {
    const tab = e.target.closest && e.target.closest('.b-tab[data-b]');
    if (!tab) return;
    e.preventDefault();
    const s = current(); if (s) branchSheet(s, tab.dataset.b);
  };
  $('#branchBar').ondblclick = branchManage;
  $('#branchBar').oncontextmenu = branchManage;

  /* 消息区 */
  $('#messages').onclick = async e => {
    const copyBtn = e.target.closest('.code-copy');
    if (copyBtn) { const code = copyBtn.closest('.codeblock').querySelector('code'); copyText(code.textContent); return; }
    const rToggle = e.target.closest('.r-toggle');
    if (rToggle) { const b = $('.r-body', rToggle.closest('.reasoning')); b.hidden = !b.hidden; return; }
    const s = current(); if (!s) return;
    const btn = e.target.closest('[data-act]'); if (!btn) return;
    const msgEl = e.target.closest('.msg'); const id = msgEl.dataset.id;
    const node = s.messages[id]; if (!node) return;
    const act = btn.dataset.act;
    if (act === 'copy') copyText(contentOf(node));
    else if (act === 'edit') editMessage(s, id);
    else if (act === 'regen') regenerate();
    else if (act === 'branch') branchFrom(s, id);
    else if (act === 'del') deleteMessage(s, id);
    else if (act === 'var-prev' || act === 'var-next') {
      if (!node.variants || node.variants.length < 2) return;
      const d = act === 'var-prev' ? -1 : 1;
      node.activeVariant = clamp(node.activeVariant + d, 0, node.variants.length - 1);
      node.content = node.variants[node.activeVariant].content;
      node.reasoning = node.variants[node.activeVariant].reasoning;
      await persistSession(s);
      renderChat(); updateCtxBar();
    }
  };

  /* 滚动 */
  $('#chatScroll').addEventListener('scroll', () => {
    const sc = $('#chatScroll');
    S.stickBottom = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 80;
  }, { passive: true });

  /* 空状态卡片 */
  $('#esDemo').onclick = useDemo;
  $('#esAddApi').onclick = () => openSettings('api');
  $('#esGuide').onclick = openGuide;

  /* 输入区 */
  const input = $('#input');
  input.addEventListener('input', autoSize);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sendMessage(); return; }
    if (e.key === 'Enter' && S.settings.enterSend && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); sendMessage(); }
  });
  $('#btnSend').onclick = () => { if (S.streaming) { if (S.abort) S.abort.abort(); } else sendMessage(); };

  /* 锁定遮罩 */
  $('#btnUnlock').onclick = doUnlock;
  $('#lockPwd').addEventListener('keydown', e => { if (e.key === 'Enter') doUnlock(); });
  $('#lockSkip').onclick = hideLock;
  $('#lockReset').onclick = async () => {
    const ok = await confirmDialog('重置密钥库将删除所有已加密保存的 API Key（对话不受影响）。确定？', { danger: true, okText: '重置' });
    if (!ok) return;
    Vault.reset(); hideLock();
    toast('密钥库已重置', 'ok');
  };

  /* 全局键盘 */
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      const last = [...document.querySelectorAll('.modal-overlay.show')].pop();
      if (last) { const c = $('.m-close', last); if (c) c.click(); }
    }
  });

  /* 自动锁定 */
  const idleDeb = U.debounce(resetIdle, 4000);
  ['click', 'keydown', 'touchstart', 'mousemove'].forEach(ev => document.addEventListener(ev, idleDeb, { passive: true }));
}

async function doUnlock() {
  const pwd = $('#lockPwd').value;
  if (!pwd) return;
  try {
    await Vault.unlock(pwd);
    hideLock();
    toast('🔓 已解锁', 'ok');
    const cb = $('#lockOverlay')._cb;
    $('#lockOverlay')._cb = null;
    if (cb) cb();
    resetIdle();
  } catch (e) {
    toast(e.message, 'err');
    const card = $('.lock-card');
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  }
}

/* ================= 启动 ================= */
async function init() {
  loadSettings();
  applyTheme();
  await DB.ready();
  try {
    const arr = await DB.all('sessions');
    arr.forEach(ensureSession);
    arr.sort((a, b) => b.updatedAt - a.updatedAt);
    S.sessions = new Map(arr.map(s => [s.id, s]));
  } catch (e) { console.error(e); Diag.log(e, 'storage', '启动时读取本地会话数据'); toast('读取本地数据失败：' + e.message, 'err'); }
  loadApis();
  const last = localStorage.getItem(LS.last);
  if (last && S.sessions.has(last)) S.currentId = last;
  else {
    const first = [...S.sessions.values()].filter(s => !s.archived).sort((a, b) => b.updatedAt - a.updatedAt)[0];
    if (first) S.currentId = first.id; else newChat();
  }
  bind();
  renderAll();
  if (!current().apiId) { current().apiId = S.activeApiId; persistSession(current()); }
  if (Vault.isSetup() && !Vault.isUnlocked()) showLock();
  maybeWelcome();
  resetIdle();
  updateCtxBar();
}

window.App = { init };
document.addEventListener('DOMContentLoaded', () => App.init());
})();

</script>
</body>
</html>
