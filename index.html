<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>织语 AI · 智能聊天工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E✦%3C/text%3E%3C/svg%3E">
<style>
/* ============ 织语 AI - 样式 ============ */
:root {
  --accent: #8b5cf6;
  --chat-fs: 15px;
  --bg: #0f1117;
  --panel: #161a24;
  --panel2: #1c2130;
  --panel3: #232a3c;
  --border: #2a3040;
  --text: #e7eaf3;
  --dim: #8d95a8;
  --dim2: #5d6478;
  --danger: #ef4444;
  --ok: #10b981;
  --warn: #f59e0b;
  --user-bub: linear-gradient(135deg, #7c5cf0, #6d4de0);
  --ai-bub: #1c2130;
  --shadow: 0 8px 30px rgba(0,0,0,.35);
  --r: 14px;
}
html[data-theme="light"] {
  --bg: #f2f4f9;
  --panel: #ffffff;
  --panel2: #f4f5fa;
  --panel3: #e9ecf5;
  --border: #dfe3ee;
  --text: #23283a;
  --dim: #6b7288;
  --dim2: #a0a6b8;
  --ai-bub: #ffffff;
  --user-bub: linear-gradient(135deg, #8b6cf6, #7551e8);
  --shadow: 0 8px 30px rgba(30,40,80,.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 14px; line-height: 1.6;
  overflow: hidden;
}
button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, textarea, select { font-family: inherit; color: var(--text); }
a { color: var(--accent); }
::selection { background: color-mix(in srgb, var(--accent) 40%, transparent); }

/* 滚动条 */
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
*::-webkit-scrollbar-thumb:hover { background: var(--dim2); }
*::-webkit-scrollbar-track { background: transparent; }

.app { display: flex; height: 100dvh; }

/* ============ 侧栏 ============ */
.sidebar {
  width: 272px; min-width: 272px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  padding: 14px 12px calc(10px + env(safe-area-inset-bottom));
  gap: 10px; z-index: 30;
}
.sb-head { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px; }
.logo { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700; letter-spacing: .5px; }
.logo i { font-style: normal; color: var(--accent); }
.logo-mark {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), #5ea2ef);
  color: #fff; font-size: 15px;
  box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 45%, transparent);
}
.logo.big { font-size: 22px; justify-content: center; padding: 8px 0; }

.new-chat-btn { border-radius: 12px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 14px; border-radius: 10px; font-size: 14px;
  border: 1px solid var(--border); background: var(--panel2);
  transition: all .16s ease; user-select: none;
}
.btn:hover { background: var(--panel3); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); border-color: transparent; color: #fff; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.1); }
.btn.danger { background: var(--danger); border-color: transparent; color: #fff; font-weight: 600; }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn.sm { padding: 6px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
.btn-row.pad { padding-top: 12px; border-top: 1px solid var(--border); margin-top: 12px; }

.sb-search input {
  width: 100%; padding: 8px 12px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--panel2); outline: none; font-size: 13px;
}
.sb-search input:focus { border-color: var(--accent); }
.sb-tabs { display: flex; gap: 4px; background: var(--panel2); border-radius: 10px; padding: 3px; }
.sb-tabs button {
  flex: 1; padding: 6px 4px; border-radius: 8px; font-size: 13px; color: var(--dim);
  transition: all .15s;
}
.sb-tabs button.on { background: var(--panel3); color: var(--text); font-weight: 600; }

.session-list { flex: 1; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
.ss-item {
  display: flex; align-items: center; gap: 4px;
  padding: 9px 8px 9px 12px; border-radius: 10px; cursor: pointer;
  transition: background .14s; position: relative;
}
.ss-item:hover { background: var(--panel2); }
.ss-item.on { background: var(--panel3); }
.ss-item.on::before {
  content: ''; position: absolute; left: 0; top: 22%; bottom: 22%;
  width: 3px; border-radius: 3px; background: var(--accent);
}
.ss-main { flex: 1; min-width: 0; }
.ss-title { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ss-meta { font-size: 11.5px; color: var(--dim2); margin-top: 1px; }
.ss-more { opacity: .45; padding: 4px; }
.ss-item:hover .ss-more { opacity: 1; }
.ss-empty { text-align: center; color: var(--dim2); padding: 30px 10px; font-size: 13px; }

.sb-foot { display: flex; gap: 6px; border-top: 1px solid var(--border); padding-top: 10px; }

/* 侧边栏记忆区块 */
.sb-mem { border-top: 1px solid var(--border); padding-top: 8px; margin-top: 2px; }
.sb-mem-head {
  display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 8px;
  font-size: 13px; color: var(--text); cursor: pointer; user-select: none; transition: background .14s;
}
.sb-mem-head:hover { background: var(--panel2); }
.sb-mem-caret { transition: transform .18s; font-size: 10px; color: var(--dim2); }
.sb-mem-caret.open { transform: rotate(90deg); }
.sb-mem-badges { margin-left: auto; display: flex; gap: 3px; }
.sb-mem-badges i {
  font-style: normal; font-size: 10px; min-width: 15px; height: 15px; padding: 0 3px;
  border-radius: 999px; background: var(--panel3); color: var(--dim);
  display: inline-flex; align-items: center; justify-content: center;
}
.sb-mem-badges i:first-child { color: #60a5fa; background: color-mix(in srgb, #60a5fa 16%, transparent); }
.sb-mem-badges i:nth-child(2) { color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); }
.sb-mem-badges i:last-child { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }
.sb-mem-body { padding: 6px 2px 4px; }
.sb-mem-tabs { display: flex; gap: 4px; margin-bottom: 6px; }
.sb-mem-tabs button {
  flex: 1; padding: 4px; font-size: 11.5px; border-radius: 7px; color: var(--dim); background: var(--panel2);
}
.sb-mem-tabs button.on { background: var(--accnorm, var(--accent)); color: #fff; font-weight: 600; background: color-mix(in srgb, var(--accent) 80%, transparent); }
.sb-mem-list { display: flex; flex-direction: column; gap: 4px; max-height: 220px; overflow-y: auto; margin-bottom: 6px; }
.mem-row {
  display: flex; gap: 6px; padding: 6px 8px; border-radius: 8px;
  background: var(--panel2); border: 1px solid var(--border); align-items: flex-start;
}
.mem-row-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-top: 6px; flex-shrink: 0; }
.mem-row-body { flex: 1; min-width: 0; }
.mem-row-text { font-size: 11.5px; line-height: 1.5; word-break: break-word; }
.mem-row-span { font-size: 9.5px; color: var(--dim2); margin-top: 1px; }
.mem-row-ops { display: flex; gap: 2px; margin-top: 3px; opacity: .8; }
.mem-row-ops:hover { opacity: 1; }
.mop { font-size: 11px; padding: 1px 5px; border-radius: 5px; color: var(--dim2); }
.mop:hover { background: var(--panel3); color: var(--text); }
.sb-mem-ops { display: flex; gap: 6px; }
.sb-mem-ops .btn { flex: 1; padding: 5px 6px; font-size: 11.5px; }

.sb-foot .ghost {
  padding: 8px 10px; border-radius: 10px; font-size: 13px; color: var(--dim);
  background: transparent; border: 1px solid transparent; transition: all .15s;
}
.sb-foot .ghost:hover { background: var(--panel2); color: var(--text); }
.sb-foot .grow { flex: 1; text-align: left; }

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 28px; height: 28px; border-radius: 8px; font-size: 14px;
  color: var(--dim); transition: all .14s; padding: 2px;
}
.icon-btn:hover { background: var(--panel3); color: var(--text); }

.backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.5);
  opacity: 0; transition: opacity .2s; z-index: 25; backdrop-filter: blur(2px);
}
.backdrop.show { opacity: 1; }

/* ============ 主区域 ============ */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
.topbar {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px calc(10px);
  border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: blur(10px);
  z-index: 10;
}
.title-wrap { flex: 1; min-width: 0; cursor: pointer; }
#chatTitle {
  font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#chatTitle:hover::after { content: ' ✎'; font-size: 12px; color: var(--dim); }
.sub { font-size: 11.5px; color: var(--dim2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { display: flex; gap: 6px; align-items: center; }
.chip-btn {
  padding: 6px 11px; border-radius: 999px; font-size: 12.5px;
  border: 1px solid var(--border); background: var(--panel2); color: var(--text);
  transition: all .15s; white-space: nowrap;
}
.chip-btn:hover { border-color: var(--accent); color: var(--accent); }

/* 分支栏 */
.branch-bar {
  display: flex; gap: 6px; padding: 8px 16px 0; overflow-x: auto;
  scrollbar-width: none; flex-shrink: 0;
}
.branch-bar::-webkit-scrollbar { display: none; }
.b-tab {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px; border-radius: 999px; font-size: 12.5px; white-space: nowrap;
  background: var(--panel2); border: 1px solid var(--border); color: var(--dim);
  transition: all .15s; flex-shrink: 0;
}
.b-tab .dot { width: 7px; height: 7px; border-radius: 50%; background: hsl(var(--bh, 260), 70%, 62%); }
.b-tab.on { background: color-mix(in srgb, var(--accent) 16%, var(--panel2)); border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); color: var(--text); font-weight: 600; }
.b-tab:hover { color: var(--text); }
.b-tab.add { border-style: dashed; color: var(--dim2); }
.b-tab.add:hover { color: var(--accent); border-color: var(--accent); }
.b-edit { opacity: .6; font-size: 11px; padding: 0 2px; }
.b-edit:hover { opacity: 1; }

/* 消息区 */
.chat-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; scroll-behavior: auto; }
.messages {
  max-width: 860px; margin: 0 auto;
  padding: 18px 16px 30px;
  display: flex; flex-direction: column; gap: 18px;
}
.msg { display: flex; gap: 10px; animation: rise .22s ease; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.msg.user { flex-direction: row-reverse; }
.avatar {
  width: 34px; height: 34px; border-radius: 12px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 16px;
  background: var(--panel2); border: 1px solid var(--border);
  margin-top: 2px;
}
.msg.assistant .avatar { background: linear-gradient(135deg, var(--accent), #5ea2ef); color: #fff; border: none; }
.bubble-wrap { max-width: min(76%, 640px); min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.msg.user .bubble-wrap { align-items: flex-end; }
.meta { font-size: 11px; color: var(--dim2); display: flex; gap: 8px; padding: 0 4px; }
.bubble {
  padding: 10px 14px; border-radius: var(--r);
  background: var(--ai-bub); border: 1px solid var(--border);
  font-size: var(--chat-fs); line-height: 1.75;
  word-break: break-word; overflow-wrap: anywhere;
  box-shadow: 0 2px 10px rgba(0,0,0,.06);
  max-width: 100%;
}
.msg.user .bubble {
  background: var(--user-bub); color: #fff; border: none;
  border-top-right-radius: 5px;
}
.msg.assistant .bubble { border-top-left-radius: 5px; }
.msg.has-err .bubble { border-color: color-mix(in srgb, var(--danger) 55%, var(--border)); background: color-mix(in srgb, var(--danger) 8%, var(--ai-bub)); }
.bubble.streaming::after { content: '▍'; color: var(--accent); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* markdown 内元素 */
.bubble p { margin: 4px 0; }
.bubble p:first-child { margin-top: 0; } .bubble p:last-child { margin-bottom: 0; }
.bubble h1, .bubble h2, .bubble h3, .bubble h4 { margin: 10px 0 6px; line-height: 1.4; }
.bubble h1 { font-size: 1.25em; } .bubble h2 { font-size: 1.15em; } .bubble h3 { font-size: 1.05em; } .bubble h4 { font-size: 1em; }
.bubble ul, .bubble ol { padding-left: 1.4em; margin: 4px 0; }
.bubble li { margin: 2px 0; }
.bubble blockquote {
  border-left: 3px solid color-mix(in srgb, var(--accent) 60%, var(--border));
  padding: 4px 10px; margin: 6px 0; color: var(--dim);
  background: color-mix(in srgb, var(--accent) 7%, transparent); border-radius: 0 8px 8px 0;
}
.bubble hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
.bubble code.ic {
  background: rgba(127,127,127,.18); padding: 1.5px 6px; border-radius: 6px;
  font-family: ui-monospace, Consolas, "Courier New", monospace; font-size: .88em;
}
.bubble del { opacity: .6; }
.codeblock { border-radius: 10px; overflow: hidden; margin: 8px 0; border: 1px solid var(--border); background: #0b0e15; }
html[data-theme="light"] .codeblock { background: #10141d; }
.code-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 5px 12px; background: rgba(255,255,255,.05); color: #8d95a8; font-size: 11.5px;
}
.code-copy { color: #8d95a8; font-size: 11.5px; padding: 2px 8px; border-radius: 6px; }
.code-copy:hover { color: #fff; background: rgba(255,255,255,.1); }
.codeblock pre { padding: 10px 14px; overflow-x: auto; }
.codeblock code { font-family: ui-monospace, Consolas, "Courier New", monospace; font-size: 13px; color: #dce3f2; line-height: 1.6; }
.tbl-wrap { overflow-x: auto; margin: 8px 0; border: 1px solid var(--border); border-radius: 10px; }
.bubble table { border-collapse: collapse; width: 100%; font-size: .92em; }
.bubble th, .bubble td { padding: 7px 12px; border-bottom: 1px solid var(--border); text-align: left; }
.bubble th { background: var(--panel2); font-weight: 600; }
.bubble tr:last-child td { border-bottom: none; }

/* 思考过程 */
.reasoning { width: 100%; }
.r-toggle {
  font-size: 11.5px; color: var(--dim2); padding: 3px 10px; border-radius: 8px;
  background: var(--panel2); border: 1px dashed var(--border);
}
.r-toggle:hover { color: var(--dim); }
.r-body {
  margin-top: 6px; padding: 8px 12px; border-radius: 10px;
  background: var(--panel2); border: 1px dashed var(--border);
  color: var(--dim); font-size: 12.5px; line-height: 1.7;
  max-height: 200px; overflow-y: auto;
}

/* 消息操作 */
.msg-actions {
  display: flex; gap: 2px; align-items: center; flex-wrap: wrap;
  opacity: .75; transition: opacity .15s; padding: 0 2px;
}
.msg:hover .msg-actions { opacity: 1; }
.msg-actions button {
  font-size: 11.5px; color: var(--dim2); padding: 3px 8px; border-radius: 7px;
  transition: all .13s;
}
.msg-actions button:hover { background: var(--panel2); color: var(--text); }
.vars { display: inline-flex; align-items: center; gap: 4px; margin-left: 6px; font-size: 11.5px; color: var(--dim2); }
.vars button { padding: 3px 7px !important; font-size: 13px !important; }

.edit-area { width: 100%; min-height: 80px; resize: vertical; }
.edit-btns { display: flex; gap: 8px; margin-top: 8px; }

/* 空状态 */
.empty-state { max-width: 640px; margin: 0 auto; padding: 9vh 24px 30px; text-align: center; }
.es-logo {
  width: 74px; height: 74px; margin: 0 auto 16px; border-radius: 24px;
  display: flex; align-items: center; justify-content: center; font-size: 34px;
  background: linear-gradient(135deg, var(--accent), #5ea2ef);
  box-shadow: 0 12px 40px color-mix(in srgb, var(--accent) 40%, transparent);
  animation: float 3.4s ease-in-out infinite;
}
@keyframes float { 50% { transform: translateY(-7px); } }
.empty-state h2 { font-size: 24px; margin-bottom: 6px; }
.es-sub { color: var(--dim); font-size: 13px; margin-bottom: 26px; }
.es-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.es-card {
  display: flex; flex-direction: column; gap: 5px; align-items: center;
  padding: 18px 12px; border-radius: 16px;
  background: var(--panel); border: 1px solid var(--border);
  transition: all .18s; text-align: center;
}
.es-card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: var(--shadow); }
.es-ico { font-size: 24px; }
.es-card b { font-size: 14px; }
.es-card span:last-child { font-size: 11.5px; color: var(--dim); line-height: 1.5; }

/* ============ 输入区 ============ */
.composer {
  padding: 6px 16px calc(10px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--border);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  max-width: 892px; width: 100%; margin: 0 auto;
}
.ctx-wrap { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.ctx-wrap.hidden { display: none; }
.ctx-bar { flex: 1; height: 3px; border-radius: 3px; background: var(--panel3); overflow: hidden; }
#ctxFill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .3s, background .3s; }
#ctxFill.warn { background: var(--warn); }
#ctxFill.danger { background: var(--danger); }
.ctx-hint { font-size: 10.5px; color: var(--dim2); white-space: nowrap; }
.composer-row { display: flex; align-items: flex-end; gap: 10px; }
#input {
  flex: 1; resize: none; border: 1px solid var(--border);
  background: var(--panel2); border-radius: 14px;
  padding: 11px 14px; font-size: var(--chat-fs); line-height: 1.55;
  outline: none; max-height: 180px; min-height: 44px;
  transition: border-color .15s, box-shadow .15s;
}
#input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
.send-btn {
  width: 44px; height: 44px; border-radius: 14px; flex-shrink: 0;
  background: var(--accent); color: #fff; font-size: 17px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s; box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 40%, transparent);
}
.send-btn:hover { filter: brightness(1.12); }
.send-btn:active { transform: scale(.94); }
.send-btn.stop { background: var(--danger); }
.composer-meta { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--dim2); padding: 5px 4px 0; }

/* ============ 模态框 ============ */
.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(8,10,16,.6); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  padding: 20px; opacity: 0; transition: opacity .18s;
}
.modal-overlay.show { opacity: 1; }
.modal-overlay.wide .modal { width: min(680px, 100%); }
.modal {
  width: min(460px, 100%); max-height: min(86dvh, 780px);
  background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
  box-shadow: var(--shadow);
  display: flex; flex-direction: column;
  transform: translateY(10px) scale(.98); transition: transform .18s;
  overflow: hidden;
}
.modal-overlay.show .modal { transform: none; }
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px 10px;
}
.modal-head h3 { font-size: 16px; }
.modal-body { padding: 4px 18px 16px; overflow-y: auto; flex: 1; }
.modal-foot { padding: 0 18px 16px; display: flex; gap: 10px; justify-content: flex-end; }
.modal-foot .btn { min-width: 84px; }
.confirm-text { font-size: 14px; line-height: 1.7; padding: 4px 0 8px; }

.ipt {
  width: 100%; padding: 9px 12px; border-radius: 10px;

<script>
/* 织语 AI - 通用工具 */
(function () {
'use strict';

const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));

function debounce(fn, ms) {
  let t = null;
  return function (...a) { clearTimeout(t); t = setTimeout(() => fn.apply(this, a), ms); };
}

/* 估算 token：CJK 字符约 1 token，其余按 4 字符 1 token */
function estimateTokens(text) {
  if (!text) return 0;
  const cjk = (String(text).match(/[\u2e80-\u9fff\u3040-\u30ff\uac00-\ud7af\uf900-\ufaff]/g) || []).length;
  return Math.ceil(cjk * 1.05 + (String(text).length - cjk) / 3.8);
}

function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts), now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (d.getFullYear() === now.getFullYear()) return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
}

function relTime(ts) {
  if (!ts) return '';
  const diff = Date.now() - ts;
  const m = 60000, h = 3600000, d = 86400000;
  if (diff < m) return '刚刚';
  if (diff < h) return Math.floor(diff / m) + ' 分钟前';
  if (diff < d) return Math.floor(diff / h) + ' 小时前';
  if (diff < 2 * d) return '昨天';
  if (diff < 7 * d) return Math.floor(diff / d) + ' 天前';
  const dt = new Date(ts);
  return dt.getMonth() + 1 + '/' + dt.getDate();
}

/* ---------- Toast ---------- */

/* ---------- 通用模态框 ---------- */
let openModals = [];
function modal(opts) {

  ov.className = 'modal-overlay' + (o.sheet ? ' as-sheet' : '');

    <div class="modal" role="dialog" aria-modal="true">

  if (typeof o.body === 'string') bodyEl.innerHTML = o.body;
  else if (o.body) bodyEl.appendChild(o.body);

  const api = { ov, body: bodyEl, foot: footEl, close };
  function close(val) {

    ov.classList.remove('show');
    setTimeout(() => ov.remove(), 180);

function confirmDialog(text, opts) {

      actions: [

        { label: o.okText || '确定', cls: o.danger ? 'danger' : 'primary', onClick: (mm) => { done(true); mm.close(); } },
      ],
      onClose: () => done(false),

function promptDialog(text, def, opts) {
  const o = opts || {};
  return new Promise(res => {

    const done = v => { if (!settled) { settled = true; res(v); } };
    const m = modal({

/* ---------- 底部动作面板（手机友好） ---------- */
function sheet(title, items) {

      <div class="sheet-title">${esc(title || '操作')}</div>

        ${it.icon ? `<span class="si-ico">${it.icon}</span>` : ''}<span>${esc(it.label)}</span></button>`).join('')}
      <button class="sheet-item cancel">取消</button>
    </div>`;
    function close(v) { ov.classList.remove('show'); setTimeout(() => ov.remove(), 200); res(v); }

/* ---------- 剪贴板 / 下载 ---------- */
async function copyText(text) {

  a.href = URL.createObjectURL(blob);
  a.download = filename;

}

function fmtBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(2) + ' MB';
}

/* 织语 AI - 错误日志 / 诊断模块
 * 自动捕获全局错误，每条错误附带“简要描述”帮助定位问题；
 * 持久化到 localStorage（最近 100 条），可复制反馈。
 */
(function () {
'use strict';

const LS_KEY = 'zc_diag_v1';
const MAX = 100;

/* 关键词 → 人话描述 */
const RULES = [
  [/网络请求失败|Failed to fetch|NetworkError|ERR_CONNECTION|fetch/i,
    '请求无法发出。常见原因：网络断开、Base URL 写错、或该 API 不允许浏览器直连（CORS 限制）。可先用「测试连接」验证。'],
  [/API 错误 401|invalid.*key|Unauthorized|incorrect API key/i,
    '鉴权失败：API Key 无效、过期或未填写。请到 设置 → API 接口 重新保存 Key。'],
  [/API 错误 403/i,
    '无权限：该 Key 没有访问此模型的权限，或账号未开通对应服务。'],
  [/API 错误 404/i,
    '地址或模型不存在：检查 Base URL 结尾是否多写了路径、模型名是否拼写正确。'],
  [/API 错误 402|insufficient.*balance|余额/i,
    '账户余额不足，请到服务商控制台充值。'],
  [/API 错误 429|rate.?limit|Too Many Requests/i,
    '触发限流：请求太频繁或额度用尽，稍等片刻再试；也可调低上下文长度减少消耗。'],
  [/API 错误 5\d\d|server error|overloaded/i,
    '服务商暂时故障或过载，稍后重试通常可恢复。'],
  [/AbortError/i,
    '请求被手动停止（点了停止按钮或切换页面），属于正常行为。'],
  [/IndexedDB|indexeddb/i,
    '本地数据库不可用（可能是无痕/隐私模式或存储被禁用），已自动回退到 localStorage，容量较小。'],
  [/QuotaExceeded|quota/i,
    '本地存储空间已满：请删除部分旧对话或导出备份后清理。'],
  [/crypto|subtle|Secure context|secure context/i,
    '浏览器禁用了加密组件：通过局域网 http:// 访问时会出现。Key 请选择“仅本会话”，或改用 localhost / HTTPS 访问。'],
  [/JSON|parse|Unexpected token/i,
    '数据解析异常：多半是模型返回了预期外的格式（或导入的备份文件格式不对）。'],
  [/模型返回了空内容|empty/i,
    '模型没有返回内容：可能是上下文超限或参数（如思考预算/最大长度）设置不当，可调大上下文后重试。'],
  [/stream|SSE|reader/i,
    '流式传输中断：网络波动或服务端提前断开。已有内容会保留，可点“重新生成”。'],
  [/decrypt|解密|主密码/i,
    '解密失败：主密码不匹配，或加密数据已损坏。'],
  [/loop|死循环|infinite/i,
    '检测到异常循环，已自动中断。'],
];

function describe(msg) {
  for (const [re, desc] of RULES) if (re.test(msg)) return desc;
  return '未归类错误。若反复出现，请点「复制日志」保存并反馈。';
}

let entries = [];
try { entries = JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch (e) { entries = []; }
if (!Array.isArray(entries)) entries = [];

function persist() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(entries.slice(0, MAX))); } catch (e) {}
}

const Diag = {
  /* 记录一条错误：msg 必填，kind 可选（js/rejection/network/storage/other），extra 附加信息 */
  log(msg, kind, extra) {
    const text = String((msg && msg.message) || msg || '').slice(0, 400);
    if (!text) return;
    /* 短时间去重：同一错误 2 秒内只记一次 */
    const last = entries[0];
    if (last && last.msg === text && Date.now() - last.ts < 2000) return;
    entries.unshift({ ts: Date.now(), kind: kind || 'other', msg: text, desc: describe(text), extra: extra ? String(extra).slice(0, 200) : '' });
    entries = entries.slice(0, MAX);
    persist();
    document.dispatchEvent(new CustomEvent('diag:new', { detail: entries[0] }));
  },

  list() { return entries; },
  clear() { entries = []; persist(); },
  count() { return entries.length; },

  /* 导出为可读文本（复制反馈用） */
  toText() {
    return entries.map(e =>
      `[${new Date(e.ts).toLocaleString()}] (${e.kind}) ${e.msg}` +
      (e.extra ? `\n  上下文: ${e.extra}` : '') +
      `\n  简述: ${e.desc}`
    ).join('\n\n') || '（暂无错误记录）';
  },

  install() {
    window.addEventListener('error', e => {
      if (e.error && e.error.name === 'AbortError') return;
      Diag.log(e.message || (e.error && e.error.message) || '脚本错误',
        'js', (e.filename || '') + ':' + (e.lineno || 0));
    });
    window.addEventListener('unhandledrejection', e => {
      const r = e.reason;
      if (r && r.name === 'AbortError') return;
      Diag.log(r instanceof Error ? r.message : String(r), 'promise');
    });
    window.addEventListener('securitypolicyviolation', e => Diag.log('CSP 拦截: ' + e.violatedDirective, 'csp', e.blockedURI));
  },
};

Diag.install();
window.Diag = Diag;
})();


/* 织语 AI - 轻量 Markdown 渲染（输出前整体转义，防 XSS） */
(function () {
'use strict';

function inline(s) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return '\u0001' + (codes.length - 1) + '\u0001'; });

  const links = [];
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (m, t, u) => {
    links.push({ t: t, u: u }); return '\u0002' + (links.length - 1) + '\u0002';
  });
  s = s.replace(/(^|[\s(（])(https?:\/\/[^\s<）)"']+)/g, (m, p, u) => {
    links.push({ t: u, u: u }); return p + '\u0002' + (links.length - 1) + '\u0002';
  });

  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/__([^_\n]+)__/g, '<b>$1</b>');
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<i>$2</i>');
  s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');

  s = s.replace(/\u0002(\d+)\u0002/g, (m, i) => {
    const l = links[+i];
    return `<a href="${l.u}" target="_blank" rel="noopener noreferrer">${l.t}</a>`;
  });
  s = s.replace(/\u0001(\d+)\u0001/g, (m, i) => `<code class="ic">${codes[+i]}</code>`);
  return s;
}

function render(src) {
  src = String(src == null ? '' : src).replace(/\r\n?/g, '\n');

  /* 提取围栏代码块 */
  const blocks = [];
  src = src.replace(/```([\w+#.\-]*)[^\S\n]*\n?([\s\S]*?)(?:```|$)/g, (m, lang, code) => {
    blocks.push({ lang: lang, code: code.replace(/\n$/, '') });
    return '\u0003CB' + (blocks.length - 1) + '\u0003';
  });

  src = U.esc(src);

  const lines = src.split('\n');
  let out = [], i = 0;

  const flushP = (buf) => { if (buf.length) out.push(`<p>${inline(buf.join('<br>'))}</p>`); buf.length = 0; };
  const pbuf = [];

  while (i < lines.length) {
    let line = lines[i];

    /* 代码块占位 */
    let cb = line.match(/^\u0003CB(\d+)\u0003\s*$/);
    if (cb) { flushP(pbuf); const b = blocks[+cb[1]];
      out.push(`<div class="codeblock"><div class="code-head"><span>${U.esc(b.lang || '代码')}</span><button class="code-copy" type="button">复制</button></div><pre><code>${U.esc(b.code)}</code></pre></div>`);
      i++; continue; }

    /* 标题 */
    let h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { flushP(pbuf); const n = h[1].length;
      out.push(`<h${n}>${inline(h[2])}</h${n}>`); i++; continue; }

    /* 分隔线 */
    if (/^\s*(---+|\*\*\*+|___+)\s*$/.test(line)) { flushP(pbuf); out.push('<hr>'); i++; continue; }

    /* 引用 */
    if (/^\s*&gt;\s?/.test(line)) {
      flushP(pbuf); const q = [];
      while (i < lines.length && /^\s*&gt;\s?/.test(lines[i])) { q.push(lines[i].replace(/^\s*&gt;\s?/, '')); i++; }
      out.push(`<blockquote>${inline(q.join('<br>'))}</blockquote>`); continue;
    }

    /* 表格 */
    if (/\|/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1]) && lines[i + 1].includes('-')) {
      flushP(pbuf);
      const parseRow = r => r.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim());
      const heads = parseRow(line); i += 2;
      let rows = [];
      while (i < lines.length && lines[i].includes('|') && !/^\u0003/.test(lines[i])) { rows.push(parseRow(lines[i])); i++; }
      let t = '<div class="tbl-wrap"><table><thead><tr>' + heads.map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>';
      rows.forEach(r => { t += '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>'; });
      t += '</tbody></table></div>';
      out.push(t); continue;
    }

    /* 列表（支持两级嵌套） */
    let lm = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
    if (lm) {
      flushP(pbuf);
      const ordered = /\d/.test(lm[2]);
      const items = [];
      while (i < lines.length) {
        const mm = lines[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
        if (mm) { items.push({ indent: mm[1].length, text: mm[3] }); i++; continue; }
        if (lines[i].trim() === '' && i + 1 < lines.length && /^(\s*)([-*+]|\d+[.)])\s+/.test(lines[i + 1])) { i++; continue; }
        break;
      }
      let html = ordered ? '<ol>' : '<ul>';
      let level = 0;
      items.forEach(it => {
        const lv = it.indent >= 2 ? 1 : 0;
        if (lv > level) { html += (ordered ? '<ol>' : '<ul>'); level = lv; }
        if (lv < level) { html += (ordered ? '</ol>' : '</ul>'); level = lv; }
        html += `<li>${inline(it.text)}</li>`;
      });
      while (level-- > 0) html += (ordered ? '</ol>' : '</ul>');
      html += ordered ? '</ol>' : '</ul>';
      out.push(html); continue;
    }

    /* 空行 */
    if (line.trim() === '') { flushP(pbuf); i++; continue; }

    /* 普通段落 */
    pbuf.push(line); i++;
  }
  flushP(pbuf);

  return out.join('\n');
}

window.MD = { render, inline };
})();


/* 织语 AI - 本地存储层（IndexedDB，失败时回退 localStorage） */
(function () {
'use strict';

const DB_NAME = 'zc-weaver-chat', DB_VER = 2;
let dbp = null, fallback = null;

function open() {
  if (dbp) return dbp;
  const ver = 'idbver2';
  if (localStorage.getItem(ver) !== '1') {
    /* 触发升级（如果旧库版本 <2），同源下 indexedDB.open 会走 onupgradeneeded */
  }
  dbp = new Promise((res, rej) => {
    if (!('indexedDB' in window)) return rej(new Error('IndexedDB 不可用'));
    const rq = indexedDB.open(DB_NAME, DB_VER);
    rq.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('sessions')) db.createObjectStore('sessions', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv', { keyPath: 'k' });
      if (!db.objectStoreNames.contains('characters')) db.createObjectStore('characters', { keyPath: 'id' });
    };
    rq.onsuccess = () => { localStorage.setItem(ver, '1'); res(rq.result); };
    rq.onerror = () => rej(rq.error || new Error('IndexedDB 打开失败'));
    rq.onblocked = () => rej(new Error('IndexedDB 被占用，请关闭其他本页签后刷新'));
  });
  dbp.catch(() => { dbp = null; });
  return dbp;
}

function initFallback() {
  if (fallback) return fallback;
  fallback = {
    _get: k => { try { return JSON.parse(localStorage.getItem('zc_idbf_' + k) || 'null'); } catch (e) { return null; } },
    _set: (k, v) => localStorage.setItem('zc_idbf_' + k, JSON.stringify(v)),
  };
  console.warn('[织语] IndexedDB 不可用，回退到 localStorage 存储（容量有限）');
  return fallback;
}

const DB = {
  async ready() {
    try { await open(); return 'idb'; }
    catch (e) { initFallback(); return 'ls'; }
  },

  async put(store, val) {
    if (fallback) { const m = fallback._get(store) || {}; m[val.id || val.k] = val; fallback._set(store, m); return; }
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction(store, 'readwrite');
      t.objectStore(store).put(val);
      t.oncomplete = () => res();
      t.onerror = () => rej(t.error);
    });
  },

  async get(store, key) {
    if (fallback) { const m = fallback._get(store) || {}; return m[key] || null; }
    const db = await open();
    return new Promise((res, rej) => {
      const rq = db.transaction(store).objectStore(store).get(key);
      rq.onsuccess = () => res(rq.result || null);
      rq.onerror = () => rej(rq.error);
    });
  },

  async all(store) {
    if (fallback) { const m = fallback._get(store) || {}; return Object.values(m); }
    const db = await open();
    return new Promise((res, rej) => {
      const rq = db.transaction(store).objectStore(store).getAll();
      rq.onsuccess = () => res(rq.result || []);
      rq.onerror = () => rej(rq.error);
    });
  },

  async del(store, key) {
    if (fallback) { const m = fallback._get(store) || {}; delete m[key]; fallback._set(store, m); return; }
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction(store, 'readwrite');
      t.objectStore(store).delete(key);
      t.oncomplete = () => res();
      t.onerror = () => rej(t.error);
    });
  },

  async clear(store) {
    if (fallback) { fallback._set(store, {}); return; }
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction(store, 'readwrite');
      t.objectStore(store).clear();
      t.oncomplete = () => res();
      t.onerror = () => rej(t.error);
    });
  },

  async usage() {
    if (fallback) {
      let n = 0;
      for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); n += (localStorage.getItem(k) || '').length + k.length; }
      return { usage: n * 2, quota: 5 * 1048576 };
    }
    if (navigator.storage && navigator.storage.estimate) {
      try { const e = await navigator.storage.estimate(); return { usage: e.usage || 0, quota: e.quota || 0 }; } catch (e) {}
    }
    return { usage: 0, quota: 0 };
  }
};

window.DB = DB;
})();


/* 织语 AI - 密钥保险库
 * 设计：
 *  - API Key 永不明文落盘。以主密码经 PBKDF2(310k 轮) 派生 AES-256 密钥，
 *    用 AES-GCM 加密后存入 localStorage；主密码与派生密钥仅存在于内存。
 *  - 非安全上下文（如手机通过局域网 http 访问）浏览器禁用 WebCrypto，
 *    此时仅提供“仅本会话保存”（内存），刷新后需重输，杜绝明文落盘。
 */
(function () {
'use strict';

const STORE = 'zc_keyring_v1';
const ITER = 310000;
const CHECK_PLAIN = 'zc-vault-ok-v1';

const Vault = {
  _key: null,          // 内存中的 AES 密钥（解锁后）
  _ephemeral: new Map(), // 仅本会话的 Key
  ring: null,

  subtleOK() { return !!(window.crypto && crypto.subtle && crypto.subtle.importKey); },

  load() {
    try { Vault.ring = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { Vault.ring = null; }
    return Vault.ring;
  },
  save() { localStorage.setItem(STORE, JSON.stringify(Vault.ring)); },

  isSetup() { return !!Vault.ring; },
  isUnlocked() { return !!Vault._key; },

  /* 首次设置主密码 */
  async setup(password) {
    if (!Vault.subtleOK()) throw new Error('当前浏览器环境不支持加密（需 HTTPS 或 localhost）');
    if (Vault.isSetup()) throw new Error('密钥库已存在');
    if (!password || password.length < 4) throw new Error('主密码至少 4 位');
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const key = await Vault._derive(password, salt, ITER);
    const verifier = await Vault._enc(key, CHECK_PLAIN);
    Vault.ring = { v: 1, salt: b64(salt), iterations: ITER, verifier, keys: {}, createdAt: Date.now() };
    Vault._key = key;
    Vault.save();
    return true;
  },

  /* 解锁 */
  async unlock(password) {
    if (!Vault.ring) throw new Error('尚未设置主密码');
    const salt = fromB64(Vault.ring.salt);
    let key, plain;
    try {
      key = await Vault._derive(password, salt, Vault.ring.iterations || ITER);
      plain = await Vault._dec(key, Vault.ring.verifier);
    } catch (e) {
      throw new Error('主密码错误');
    }
    if (plain !== CHECK_PLAIN) throw new Error('主密码错误');
    Vault._key = key;
    return true;
  },

  lock() { Vault._key = null; },

  /* 修改主密码（需已解锁） */
  async changePassword(oldPwd, newPwd) {
    if (!Vault.ring) throw new Error('尚未设置主密码');
    const salt = fromB64(Vault.ring.salt);
    let oldKey, plain;
    try {
      oldKey = await Vault._derive(oldPwd, salt, Vault.ring.iterations || ITER);
      plain = await Vault._dec(oldKey, Vault.ring.verifier);
    } catch (e) {
      throw new Error('旧主密码错误');
    }
    if (plain !== CHECK_PLAIN) throw new Error('旧主密码错误');
    const newSalt = crypto.getRandomValues(new Uint8Array(16));
    const newKey = await Vault._derive(newPwd, newSalt, ITER);
    const verifier = await Vault._enc(newKey, CHECK_PLAIN);
    const keys = {};
    for (const [id, blob] of Object.entries(Vault.ring.keys || {})) {
      const secret = await Vault._dec(oldKey, blob);
      keys[id] = await Vault._enc(newKey, secret);
    }
    Vault.ring = { ...Vault.ring, salt: b64(newSalt), iterations: ITER, verifier, keys };
    Vault._key = newKey;
    Vault.save();
    return true;
  },

  reset() {
    localStorage.removeItem(STORE);
    Vault.ring = null;
    Vault._key = null;
    Vault._ephemeral.clear();
  },

  /* 保存 Key：加密保存（需已解锁）；失败可走仅本会话 */
  async saveSecret(id, secret, mode) {
    if (mode === 'session') { Vault._ephemeral.set(id, secret); return 'session'; }
    if (!Vault.isSetup()) throw new Error('尚未设置主密码，无法加密保存');
    if (!Vault.isUnlocked()) throw new Error('密钥库已锁定，请先解锁');
    if (!Vault.subtleOK()) throw new Error('当前环境不支持加密保存（需 HTTPS 或 localhost），请改用“仅本会话”');
    const blob = await Vault._enc(Vault._key, secret);
    Vault.ring.keys = Vault.ring.keys || {};
    Vault.ring.keys[id] = blob;
    Vault.ring.updatedAt = Date.now();
    Vault.save();
    Vault._ephemeral.delete(id);
    return 'encrypted';
  },

  removeSecret(id) {
    Vault._ephemeral.delete(id);
    if (Vault.ring && Vault.ring.keys) { delete Vault.ring.keys[id]; Vault.save(); }
  },

  getSecret(id) {
    if (Vault._ephemeral.has(id)) return Vault._ephemeral.get(id);
    return null; /* 加密的 Key 只有解锁后才能异步取出，见 getSecretAsync */
  },

  async getSecretAsync(id) {
    if (Vault._ephemeral.has(id)) return Vault._ephemeral.get(id);
    if (!Vault.isUnlocked() || !Vault.ring || !Vault.ring.keys || !Vault.ring.keys[id]) return null;
    try { return await Vault._dec(Vault._key, Vault.ring.keys[id]); } catch (e) { return null; }
  },

  keyStatus(id) {
    if (Vault._ephemeral.has(id)) return 'session';
    if (Vault.ring && Vault.ring.keys && Vault.ring.keys[id]) return Vault.isUnlocked() ? 'unlocked' : 'locked';
    return 'none';
  },

  /* ---------- 内部 ---------- */
  async _derive(password, salt, iterations) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  },
  async _enc(key, plain) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(plain));
    return { iv: b64(iv), ct: b64(new Uint8Array(ct)) };
  },
  async _dec(key, blob) {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(blob.iv) }, key, fromB64(blob.ct));
    return new TextDecoder().decode(pt);
  },
};

function b64(u8) { let s = ''; for (const b of u8) s += String.fromCharCode(b); return btoa(s); }
function fromB64(s) { const bin = atob(s); const u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); return u8; }

Vault.load();
window.Vault = Vault;
})();

/* ---------- 消息规范化（Anthropic/Gemini 要求首条 user、角色交替） ---------- */
/* 返回 { system, messages }：合并连续同角色消息；若首条是 assistant，折入 system 作为剧情上下文 */
function normalizeForClaudeOrGemini(system, messages) {
  const merged = [];
  for (const m of messages) {
    const last = merged[merged.length - 1];
    if (last && last.role === m.role) last.content += '\n\n' + m.content;
    else merged.push({ role: m.role, content: m.content });
  }
  let sys = system || '';
  while (merged.length && merged[0].role === 'assistant') {
    const a = merged.shift();
    sys += (sys ? '\n\n' : '') + `【剧情开场（你此前已说过的话，作为上下文）】\n${a.content}`;
  }
  return { system: sys || undefined, messages: merged };
}

/* ---------- SSE 读取 ---------- */
async function readSSE(res, onData) {
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, idx).replace(/\r$/, '');
      buf = buf.slice(idx + 1);
      if (line.startsWith('data:')) {
        const data = line.slice(5).trim();
        if (data === '[DONE]') return;
        if (data) onData(data);
      }
    }
  }
  const tail = buf.trim();
  if (tail.startsWith('data:')) { const d = tail.slice(5).trim(); if (d && d !== '[DONE]') onData(d); }
}

/* ---------- 流式片段解析 ---------- */
function makeStreamHandler(cfg, onText, onReason) {
  if (cfg.type === 'anthropic') {
    return json => {
      if (json.type === 'content_block_delta') {
        if (json.delta && json.delta.type === 'text_delta' && json.delta.text) onText(json.delta.text);
        else if (json.delta && json.delta.type === 'thinking_delta' && json.delta.thinking) onReason(json.delta.thinking);
      } else if (json.type === 'error') {
        throw new Error((json.error && json.error.message) || 'Claude 流式错误');
      }
    };
  }
  if (cfg.type === 'gemini') {
    return json => {
      if (json.error) throw new Error(json.error.message || 'Gemini 错误');
      const parts = json.candidates && json.candidates[0] && json.candidates[0].content && json.candidates[0].content.parts || [];
      for (const pt of parts) {
        if (!pt.text) continue;
        if (pt.thought) onReason(pt.text); else onText(pt.text);
      }
    };
  }
  return json => {
    const d = json.choices && json.choices[0] && json.choices[0].delta;
    if (!d) return;
    if (d.reasoning_content) onReason(d.reasoning_content);
    else if (d.reasoning) onReason(d.reasoning);
    if (d.content) onText(d.content);
  };
}

/* ---------- 非流式结果解析 ---------- */
function parseFull(cfg, json) {
  if (cfg.type === 'anthropic') {
    let text = '', reason = '';
    for (const b of json.content || []) {
      if (b.type === 'text') text += b.text;
      else if (b.type === 'thinking') reason += b.thinking || '';
    }
    return { text, reasoning: reason };
  }
  if (cfg.type === 'gemini') {
    const parts = json.candidates && json.candidates[0] && json.candidates[0].content && json.candidates[0].content.parts || [];
    let text = '', reason = '';
    for (const pt of parts) { if (pt.thought) reason += pt.text || ''; else text += pt.text || ''; }
    return { text, reasoning: reason };
  }
  const msg = json.choices && json.choices[0] && json.choices[0].message || {};
  return { text: msg.content || '', reasoning: msg.reasoning_content || msg.reasoning || '' };
}

async function parseError(res) {
  let detail = '';
  try {
    const txt = await res.text();
    try {
      const j = JSON.parse(txt);
      detail = (j.error && (j.error.message || j.error.msg)) || j.message || j.msg || txt;
    } catch (e) { detail = txt; }
  } catch (e) {}
  detail = String(detail || '').slice(0, 500);
  const hint = res.status === 401 ? '（Key 无效或未授权）' : res.status === 429 ? '（请求过于频繁或额度不足）' :
    res.status === 404 ? '（地址或模型名可能有误）' : res.status === 402 ? '（余额不足）' : '';
  return new Error(`API 错误 ${res.status}${hint}：${detail || res.statusText}`);
}

};
function chunk(s, n) { const a = []; for (let i = 0; i < s.length; i += n) a.push(s.slice(i, i + n)); return a; }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

/* ---------- 主入口 ---------- */
async function chat(cfg, key, opts) {
  const { system, messages, params, onText, onReason, signal } = opts;
  if (cfg.type === 'demo') {
    let text = '', reason = '';
    for await (const part of Demo.gen({ messages, params })) {
      if (signal && signal.aborted) throw new DOMException('aborted', 'AbortError');
      if (part.reason) { reason += part.reason; onReason && onReason(part.reason); }
      if (part.text) { text += part.text; onText && onText(part.text); }
    }
    return { text, reasoning: reason };
  }

  const stream = params && params.stream !== false && !!onText;
  const req = buildRequest(cfg, { system, messages, params, stream, key });

  let res;
  try {
    res = await fetch(req.url, { method: 'POST', headers: req.headers, body: JSON.stringify(req.body), signal });
  } catch (e) {
    if (e.name === 'AbortError') throw e;
    throw new Error('网络请求失败：' + e.message + '（请检查 Base URL 是否正确、该接口是否允许浏览器直连）');
  }
  if (!res.ok) throw await parseError(res);

  if (!stream) {
    const json = await res.json();
    const out = parseFull(cfg, json);
    if (out.reasoning && onReason) onReason(out.reasoning);
    if (out.text && onText) onText(out.text);
    return out;
  }

  let text = '', reason = '';
  const handle = makeStreamHandler(cfg,
    t => { text += t; onText && onText(t); },
    t => { reason += t; onReason && onReason(t); });
  try {
    await readSSE(res, data => {
      let json;
      try { json = JSON.parse(data); } catch (e) { return; }
      handle(json);
    });
  } catch (e) {
    if (e.name === 'AbortError') throw e;
    if (text || reason) { console.warn('流中断但已有部分内容', e); }
    else throw e;
  }
  return { text, reasoning: reason };
}

/* 织语 AI - 记忆引擎：三级记忆（短期/长期/永久）+ 联想检索 + 自动总结 + 合并 */
(function () {
'use strict';

const STOP = new Set(('的 了 是 在 我 你 他 她 它 我们 你们 他们 和 与 就 都 很 也 被 把 让 给 对 从 到 会 能 要 有 无 这 那 什么 怎么 如何 一个 一种 自己 因为 所以 但是 而且 如果 虽然 然后 还是 就是 不是 没有 可以 已经 现在 时候 这样 那样 一下 一直 不过 只是 以及 关于 通过 对于 并且 the a an and or but if then else of to in on at for with by is are was were be been i you he she it we they this that what how why not no yes do does did can could will would should may might must have has had my your his her its our their about from into over under again once just so than too very'.split(/\s+/)));

/* 提取关键词：CJK 二元组 + 英文单词 */
function keywords(text, limit) {
  const t = String(text || '');
  const freq = new Map();
  const add = w => { if (!STOP.has(w) && w.length > 1) freq.set(w, (freq.get(w) || 0) + 1); };
  const latin = t.toLowerCase().match(/[a-z][a-z0-9'-]{1,}/g) || [];
  latin.forEach(add);
  const cjkRuns = t.match(/[\u4e00-\u9fff]{2,}/g) || [];
  for (const run of cjkRuns) {
    for (let i = 0; i < run.length - 1; i++) add(run.slice(i, i + 2));
  }
  return [...freq.entries()].sort((a, b) => b[1] - a[1]).slice(0, limit || 10).map(e => e[0]);
}

/* 联想打分：关键词重合 + 置顶 + 时间衰减 */
function retrieve(list, queryText, topK) {
  if (!list || !list.length) return [];
  const qk = new Set(keywords(queryText, 14));
  if (!qk.size) return list.filter(m => m.pinned).slice(0, topK || 6);
  const now = Date.now();
  const scored = list.map(m => {
    let s = 0;
    for (const k of (m.keywords || [])) if (qk.has(k)) s += 2;
    for (const k of keywords(m.text, 8)) if (qk.has(k)) s += 1;
    if (m.pinned) s += 3;
    const ageDays = (now - (m.updatedAt || m.createdAt || now)) / 86400000;
    s += 1.5 / (1 + ageDays / 3);
    return { m, s };
  }).filter(x => x.s > 1.6);
  scored.sort((a, b) => b.s - a.s);
  return scored.slice(0, topK || 6).map(x => x.m);
}

/* 组装注入的一级记忆块（联想检索到的 STM/LTM） */
function assocBlock(label, selected) {
  if (!selected || !selected.length) return '';
  const lines = selected.map(m => `- ${m.text}${m.pinned ? '（重要）' : ''}`);
  return `【${label}】以下是此前对话中沉淀下来的相关记忆，请在回复中自然地保持一致：\n${lines.join('\n')}`;
}
/* 永久记忆块：始终全量注入 */
function permBlock(pmList) {
  if (!pmList || !pmList.length) return '';
  const lines = pmList.map(m => `- ${m.text}${m.pinned ? '（重要）' : ''}`);
  return `【永久记忆 · 核心设定，务必始终遵守】\n${lines.join('\n')}`;
}

function digestBlock(digest) {
  if (!digest || !digest.text) return '';

}

/* 建立一条记忆记录（含时间跨度等元信息） */
function makeRec(text, importance) {
  const now = Date.now();
  return { id: U.uid(), text: String(text).slice(0, 300), importance: U.clamp(parseInt(importance, 10) || 2, 1, 3),
    keywords: keywords(text, 8), pinned: false, createdAt: now, updatedAt: now,
    span: null, /* 合并时记录时间跨度 { from, to, days } */
  };
}

async function makeSTM(session, msgs, existingSTM, ctx) {

  });
  const txt = res.text.trim().replace(/^["'「『]+|["'」』。.\s]+$/g, '').slice(0, 200);

/* 合并最早两条 → 1 条（AI 提炼，保留时间跨度/核心角色/关键转折点） */
async function mergePair(pair, label, ctx) {
  if (ctx.cfg.type === 'demo') return demoMerge(pair, label);
  const t0 = Math.min(...pair.map(x => x.createdAt || Date.now()));
  const t1 = Math.max(...pair.map(x => x.createdAt || Date.now()));
  const spanDesc = pair[0].span ? `（原跨度${pair[0].span.days}天）` : '';
  const inp = pair.map((x, i) => `${i + 1}. ${x.text}`).join('\n');
  const sys = `把下面 ${pair.length} 条记忆合并成 1 条，必须保留：①时间跨度/时间线 ②核心角色 ③关键转折点。用简体中文一段话（最多 100 字），第三人称陈述，不要分点、不要引号、不要列表符号，只输出合并后的句子。`;
  const res = await Providers.chat(ctx.cfg, ctx.key, {
    system: sys,
    messages: [{ role: 'user', content: `【待合并${label}】\n${inp}\n\n${spanDesc}` }],
    params: { temperature: 0.2, maxTokens: 160, stream: false, thinking: 'off' },
  });
  const txt = res.text.trim().replace(/^["'「『]+|["'」』。.\s]+$/g, '').slice(0, 300);
  const rec = makeRec(txt || demoMerge(pair, label).text, 3);
  rec.span = { from: t0, to: t1, days: Math.max(1, Math.round((t1 - t0) / 86400000)) };
  return rec;
}

async function summarizeBranch(session, path, keep, ctx) {
  const target = path.slice(0, Math.max(0, path.length - keep));
  if (!target.length) throw new Error('没有可总结的消息');
  return summarizeInto(session, session.digest && session.digest.text, target, ctx);
}

  const user = `【对话内容】\n${convo}\n\n【已存在的记忆（避免重复）】\n${(existing || []).slice(0, 30).map(m => '- ' + m.text).join('\n') || '（无）'}`;
  const res = await Providers.chat(ctx.cfg, ctx.key, {
    system: sys,
    messages: [{ role: 'user', content: user }],

  let arr = [];
  const m = res.text.match(/\[[\s\S]*\]/);
  if (m) { try { arr = JSON.parse(m[0]); } catch (e) {} }
  if (!Array.isArray(arr)) arr = [];
  return arr.filter(x => x && typeof x.text === 'string' && x.text.trim())

function memStore(s) {

    if (Array.isArray(s.memories) && s.memories.length) {
      /* 旧版单层记忆：全当归入长期 */

const reasoningOf = m => m.variants ? ((m.variants[m.activeVariant] || m.variants[0]) || {}).reasoning || '' : (m.reasoning || '');

function pathOf(s, tipId) {
  const out = []; const seen = new Set();
  let cur = tipId ? s.messages[tipId] : null;
  while (cur && !seen.has(cur.id)) { seen.add(cur.id); out.push(cur); cur = cur.parentId ? s.messages[cur.parentId] : null; }
  return out.reverse();
}
function effParams(s) { return { ...S.settings.defaultParams, ...(s.params || {}) }; }
function effCfg(s) { return S.apis.find(a => a.id === s.apiId) || S.apis.find(a => a.id === S.activeApiId) || S.apis[0] || null; }

  for (const b of s.branches) {
    let cur = b.tipId; const seen = new Set();
    while (cur && s.messages[cur] && !seen.has(cur)) { seen.add(cur); keep.add(cur); cur = s.messages[cur].parentId; }

  for (const id of Object.keys(s.messages)) if (!keep.has(id)) delete s.messages[id];

/* ================= 上下文组装（总结 + 记忆） ================= */
function analyzeContext(s, excludeId, systemReserve) {
  const br = activeBranch(s);
  const path = pathOf(s, br.tipId).filter(m => m.role !== 'system');
  const usable = path.filter(m => m.id !== excludeId && contentOf(m));
  const p = effParams(s);
  const budget = Math.max(600, p.contextTokens - (p.maxTokens || 2048) - 400 - (systemReserve || 0));
  let used = 0, keepFrom = usable.length;
  for (let i = usable.length - 1; i >= 0; i--) {
    const t = estimateTokens(contentOf(usable[i])) + 8;
    if (used + t > budget && i < usable.length - 1) break;
    used += t; keepFrom = i;
  }
  const dropped = usable.slice(0, keepFrom);
  const kept = usable.slice(keepFrom);
  const covered = new Set((s.digest && s.digest.upToIds) || []);
  const uncovered = dropped.filter(m => !covered.has(m.id));
  return { usable, kept, dropped, uncovered, used };
}

function buildPrompt(s, excludeId) {
  const p = effParams(s);
  const mem = memStore(s);
  /* 先组装静态 system（人设+破甲+永久记忆+剧情回顾），估算其占用后再裁剪历史 */
  const staticParts = [];
  if (s.systemPrompt && s.systemPrompt.trim()) staticParts.push(s.systemPrompt.trim());
  if (p.antiCensor) staticParts.push(ANTI_CENSOR);
  const perm = Mem.permBlock(mem.pm || []);
  if (perm) staticParts.push(perm);
  if (s.digest && s.digest.text) staticParts.push(Mem.digestBlock(s.digest.text));
  const staticSys = staticParts.join('\n\n');
  const reserve = staticSys ? estimateTokens(staticSys) : 0;

  const a = analyzeContext(s, excludeId, reserve);
  const lastUser = [...a.kept].reverse().find(m => m.role === 'user') || [...a.usable].reverse().find(m => m.role === 'user');
  const recent = lastUser ? contentOf(lastUser) : '';
  const ltm = Mem.assocBlock('长期记忆', Mem.retrieve(mem.ltm || [], recent, S.settings.memoryTopK));
  const stm = Mem.assocBlock('近期记忆', Mem.retrieve(mem.stm || [], recent, S.settings.memoryTopK));
  const parts = staticParts.slice();
  if (ltm) parts.push(ltm);
  if (stm) parts.push(stm);
  const system = parts.length ? parts.join('\n\n') : undefined;
  return {
    system,
    messages: a.kept.map(m => ({ role: m.role, content: contentOf(m) })),
    usage: a.used + (system ? estimateTokens(system) : 0),
    analysis: a,
  };
}

  const text = contentOf(m);
  const reason = reasoningOf(m);
  const leaf = isLeaf(s, m);
  const vars = m.variants || null;
  const varNav = vars && vars.length > 1
    ? `<div class="vars"><button data-act="var-prev" title="上一个版本">‹</button><span>${m.activeVariant + 1} / ${vars.length}</span><button data-act="var-next" title="下一个版本">›</button></div>` : '';
  const actions = `
    <div class="msg-actions">
      <button data-act="copy" title="复制内容">⧉ 复制</button>
      ${role === 'user' ? `<button data-act="edit" title="编辑此消息">✎ 编辑</button>` : ''}
      ${role === 'assistant' && leaf ? `<button data-act="regen" title="重新生成回复">↻ 重新生成</button>` : ''}
      <button data-act="branch" title="从此消息开启新剧情分支">🌱 分支</button>
      <button data-act="del" title="删除">🗑</button>
      ${varNav}
    </div>`;
  return `
  <div class="msg ${role}${m.error ? ' has-err' : ''}${S.streaming && !text && role === 'assistant' ? ' pending' : ''}" data-id="${m.id}">
    <div class="avatar" aria-hidden="true">${role === 'user' ? '🧑' : '✦'}</div>
    <div class="bubble-wrap">
      <div class="meta"><span class="who">${role === 'user' ? '你' : 'AI'}</span><span class="time">${fmtTime(m.createdAt)}</span></div>
      ${reason ? `<div class="reasoning"><button class="r-toggle" type="button">💭 思考过程</button><div class="r-body" hidden>${MD.render(reason)}</div></div>` : ''}
      <div class="bubble md">${MD.render(text)}</div>
      ${actions}
    </div>
  </div>`;
}

function scrollBottom(instant) {
  const sc = $('#chatScroll');
  sc.scrollTo({ top: sc.scrollHeight, behavior: instant ? 'auto' : 'smooth' });
}
function getMsgRefs(id) {
  const root = $(`#messages .msg[data-id="${id}"]`);
  if (!root) return null;
  return { root, md: $('.md', root), re: $('.reasoning', root), reBody: $('.r-body', root) };
}

/* ================= 流式生成 ================= */
function throttle(fn, ms) {
  let last = 0, t = null;
  const run = () => { last = Date.now(); t = null; fn(); };
  return () => {
    const now = Date.now();
    if (now - last >= ms) run();
    else if (!t) t = setTimeout(run, ms - (now - last));
  };
}

async function ensureReady() {
  const s = current();
  const cfg = effCfg(s);
  if (!cfg) { toast('请先在 设置 → API 接口 中添加接口', 'warn'); openSettings('api'); return null; }
  let key = '';
  if (!cfg.noKey && cfg.type !== 'demo') {
    key = await Vault.getSecretAsync(cfg.id);
    if (!key) {
      const r = await askKeyModal(cfg);
      if (r === null) return null;
      key = r;
    }
  }
  return { cfg, key };
}

async function sendMessage() {
  const input = $('#input');
  const text = input.value.trim();
  if (!text || S.streaming) return;
  const s = current();
  if (!s) return;
  const ctx = await ensureReady();
  if (!ctx) return;
  const br = activeBranch(s);
  const node = { id: uid(), parentId: br.tipId || null, role: 'user', content: text, createdAt: Date.now() };
  s.messages[node.id] = node;
  br.tipId = node.id;
  input.value = ''; autoSize();
  renderChat(); renderSidebar();
  const asNode = { id: uid(), parentId: node.id, role: 'assistant', content: '', variants: [{ content: '', reasoning: '' }], activeVariant: 0, createdAt: Date.now() };
  s.messages[asNode.id] = asNode;
  br.tipId = asNode.id;
  await streamInto(s, ctx, asNode);
}

async function regenerate() {
  const s = current(); if (!s || S.streaming) return;
  const br = activeBranch(s);
  const tip = s.messages[br.tipId];
  if (!tip || tip.role !== 'assistant') { toast('只有最后一条 AI 回复可以重新生成', 'warn'); return; }
  const ctx = await ensureReady(); if (!ctx) return;
  if (!tip.variants) tip.variants = [{ content: tip.content || '', reasoning: tip.reasoning || '' }];
  tip.variants.push({ content: '', reasoning: '' });
  tip.activeVariant = tip.variants.length - 1;
  tip.error = false;
  await streamInto(s, ctx, tip);
}

async function streamInto(s, ctx, node) {
  S.streaming = true; S.stickBottom = true; updateSendBtn();
  const target = node.variants ? node.variants[node.activeVariant] : null;
  const { system, messages, usage } = buildPrompt(s, node.id);
  const isGemini = ctx.cfg.type === 'gemini';
  const wantStream = effParams(s).stream !== false;
  const useStream = isGemini ? false : wantStream;
  renderChat();
  const refs = getMsgRefs(node.id);
  if (refs && refs.md) refs.md.classList.add('streaming');
  if (!useStream && refs && refs.md) refs.md.innerHTML = `<span class="gen-loading">⏳ 正在生成（非流式）…</span>`;
  let text = '', reason = '', err = null;
  const paint = throttle(() => {
    if (!refs) return;
    if (refs.md) { refs.md.innerHTML = MD.render(text); if (S.stickBottom) scrollBottom(true); }
    if (refs.re && reason) {
      refs.re.hidden = false;
      if (refs.reBody) refs.reBody.innerHTML = MD.render(reason);
      if (!refs.re.opened) { refs.re.opened = true; if (refs.reBody) refs.reBody.hidden = false; }
    }
  }, 90);
  S.abort = new AbortController();
  try {
    const res = await Providers.chat(ctx.cfg, ctx.key, {
      system, messages,
      params: { ...effParams(s), stream: useStream, antiCensor: effParams(s).antiCensor },
      signal: S.abort.signal,
      onText: t => { text += t; if (target) target.content = text; paint(); },
      onReason: t => { reason += t; if (target) target.reasoning = reason; paint(); },
    });
    if (!res.text && !res.reasoning) throw new Error('模型返回了空内容');
  } catch (e) {
    if (e.name === 'AbortError') { text = text || '（已停止生成）'; }
    else err = e;
  }
  S.abort = null;
  if (target) { target.content = text; target.reasoning = reason; }
  node.content = text; node.reasoning = reason;
  node.error = !!err;
  if (err) node.content = '⚠️ ' + err.message;
  if (!err) s.rounds = (s.rounds || 0) + 1;
  S.streaming = false; updateSendBtn();
  await persistSession(s);
  renderChat(); renderSidebar(); updateCtxBar();
  if (err) { Diag.log(err, 'network', '对话「' + (s.title || '') + '」生成回复'); toast(err.message, 'err', 6000); }
  else postProcess(s, ctx);
}

/* 自动标题 / 自动总结 / 记忆沉淀 */
async function postProcess(s, ctx) {
  if (S.settings.autoTitle && !s.title) {
    try {
      const path = pathOf(s, activeBranch(s).tipId);
      const fu = path.find(m => m.role === 'user'), fa = path.find(m => m.role === 'assistant');
      if (fu && fa && contentOf(fa) && !contentOf(fa).startsWith('⚠️')) {
        const t = await Mem.autoTitle(contentOf(fu), contentOf(fa).slice(0, 400), ctx);
        if (t) { s.title = t; await persistSession(s); renderSidebar(); renderTopbar(); }
      }
    } catch (e) { /* 标题失败不打扰 */ }
  }
  checkSummary(s, ctx);
  checkMemory(s, ctx);
}

async function checkSummary(s, ctx) {
  if (!S.settings.autoSummary || s._sumBusy) return;
  const a = analyzeContext(s);
  if (a.uncovered.length < (S.settings.summaryMinDropped || 4)) return;
  s._sumBusy = true;
  try {
    const text = await Mem.summarizeInto(s, s.digest && s.digest.text, a.uncovered, ctx);
    if (text) {
      const upTo = [...((s.digest && s.digest.upToIds) || []), ...a.uncovered.map(m => m.id)].slice(-500);
      s.digest = { text, upToIds: upTo, updatedAt: Date.now() };
      await persistSession(s);
      toast('📜 已自动生成新的剧情回顾', 'ok');
    }
  } catch (e) { console.warn('自动总结失败', e); }
  finally { s._sumBusy = false; }
}

async function checkMemory(s, ctx) {
  if (!S.settings.autoMemory || s._memBusy) return;
  const rounds = s.rounds || 0;
  if (rounds <= 0 || rounds % 1 !== 0) return;
  s._memBusy = true;
  try {
    const mem = memStore(s);
    const path = pathOf(s, activeBranch(s).tipId);
    const recent = path.slice(-3);
    /* 1) 每轮生成一条短期记忆 */
    let rec = null;
    try { rec = await Mem.makeSTM(s, recent, mem.stm, ctx); }
    catch (e) { console.warn('生成短期记忆失败', e); Diag.log(e, 'network', '生成短期记忆'); }
    if (rec) {
      mem.stm.push(rec);
      mem.stmTotal = (mem.stmTotal || 0) + 1;
      await persistSession(s);
      /* 2) 短期满6 → 合并最早2条 → 升长期 */
      if (mem.stm.length >= 6) {
        await mergeLevel(mem.stm, mem.ltm, '短期记忆', '长期记忆', s, ctx);
      }
      /* 3) 长期满6 → 合并最早2条 → 升永久 */
      if (mem.ltm.length >= 6) {
        await mergeLevel(mem.ltm, mem.pm, '长期记忆', '永久记忆', s, ctx);
      }
      await persistSession(s);
      renderSidebar();
    }
  } catch (e) { console.warn('记忆处理失败', e); Diag.log(e, 'other', '记忆系统'); }
  finally { s._memBusy = false; }
}

/* 合并某级最早2条 → 1条 → 送入目标级 */
async function mergeLevel(src, dst, srcLabel, dstLabel, s, ctx) {
  if (!src || !src.length) return;
  const take = src.slice(0, 2); /* 最早（按插入顺序）2 条 */
  let merged = null;
  try { merged = await Mem.mergePair(take, srcLabel, ctx); }
  catch (e) { console.warn('合并记忆失败', e); Diag.log(e, 'network', `合并${srcLabel}`); merged = await Mem.mergePair(take, srcLabel, { cfg: { type: 'demo' } }); }
  src.splice(0, 2); /* 移除已被合并的最早两条 */
  dst.push(merged);
  if (dstLabel === '长期记忆') memStore(s).ltmTotal = (memStore(s).ltmTotal || 0) + 1;
  return merged;
}

/* ================= API Key 按需输入 ================= */
function askKeyModal(cfg) {
  return new Promise(res => {
    const canSaveEnc = Vault.isSetup() && Vault.isUnlocked() && Vault.subtleOK();
    const m = modal({
      title: `「${cfg.name}」需要 API Key`,
      onClose: () => res(null),
      body: `
        <p class="hint">Key 只保存在你自己的设备上，仅在调用所选接口时随请求发送（HTTPS），不经过任何第三方。</p>
        <input type="password" class="ipt" id="akKey" placeholder="粘贴 API Key" autocomplete="off">
        <div class="save-opts">
          <label class="rad"><input type="radio" name="akMode" value="enc" ${canSaveEnc ? 'checked' : 'disabled'}> 🔐 加密保存（AES-GCM，需主密码解锁后使用）</label>
          <label class="rad"><input type="radio" name="akMode" value="session" ${canSaveEnc ? '' : 'checked'}> ⏱ 仅本会话使用（不落盘，刷新后需重新输入）</label>
        </div>
        ${!Vault.isSetup() ? `<p class="hint">💡 在 设置 → 安全与数据 中设置主密码后，即可加密保存 Key。</p>` : ''}
        ${Vault.isSetup() && !Vault.isUnlocked() ? `<p class="hint">🔒 密钥库已锁定，<a href="javascript:void(0)" id="akUnlock">先去解锁</a> 即可选择加密保存。</p>` : ''}`,
      actions: [
        { label: '取消', cls: 'ghost', onClick: mm => { mm.close(); res(null); } },
        { label: '确定', cls: 'primary', onClick: async mm => {
            const key = $('#akKey', mm.body).value.trim();
            if (!key) { toast('请输入 Key', 'warn'); return; }
            const mode = ($('input[name="akMode"]:checked', mm.body) || {}).value || 'session';
            if (mode === 'enc') {
              try { await Vault.saveSecret(cfg.id, key, 'enc'); toast('Key 已加密保存', 'ok'); }
              catch (e) { toast(e.message, 'err'); return; }
            } else {
              Vault.saveSecret(cfg.id, key, 'session');
            }
            mm.close(); res(key);
          } },
      ],
    });
    const lk = $('#akUnlock', m.body);
    if (lk) lk.onclick = () => {
      showLock(() => {
        const rad = $('input[name="akMode"][value="enc"]', m.body);
        if (rad && Vault.isUnlocked()) { rad.disabled = false; rad.checked = true; }
      });
    };
  });
}

async function renameSession(s) {

async function toggleArchive(s) {

async function deleteSession(s) {
  const ok = await confirmDialog(`确定删除对话「${esc(s.title || '新的对话')}」？其全部分支、记忆与摘要都会一并删除，且无法恢复。`, { danger: true, okText: '删除' });
  if (!ok) return;
  await DB.del('sessions', s.id);
  S.sessions.delete(s.id);
  if (S.currentId === s.id) {
    const rest = [...S.sessions.values()].filter(x => !x.archived).sort((a, b) => b.updatedAt - a.updatedAt);
    if (rest.length) openSession(rest[0].id); else newChat();
  } else renderAll();
  toast('已删除', 'ok');
}
async function duplicateSession(s) {
  const n = ensureSession(JSON.parse(JSON.stringify(s)));
  n.id = uid(); n.title = (s.title || '新的对话') + '（副本）';
  n.branches = n.branches.filter(b => b.id === s.activeBranchId);
  n.branches[0].name = '主线';
  n.activeBranchId = n.branches[0].id;
  const keep = new Set();
  let cur = n.branches[0].tipId; const seen = new Set();
  while (cur && n.messages[cur] && !seen.has(cur)) { seen.add(cur); keep.add(cur); cur = n.messages[cur].parentId; }
  for (const id of Object.keys(n.messages)) if (!keep.has(id)) delete n.messages[id];
  n.createdAt = Date.now(); n.updatedAt = Date.now();
  S.sessions.set(n.id, n);
  await persistSession(n);
  renderSidebar();
  openSession(n.id);
  toast('已创建副本（仅当前分支）', 'ok');
}
async function clearSession(s) {
  const ok = await confirmDialog('清空该对话的全部消息？（记忆与设置保留，剧情摘要将重置）', { danger: true, okText: '清空' });
  if (!ok) return;
  s.messages = {};
  s.branches = [{ id: uid(), name: '主线', tipId: null, createdAt: Date.now() }];
  s.activeBranchId = s.branches[0].id;
  s.digest = null; s.rounds = 0;
  await persistSession(s);
  renderAll();
  toast('已清空', 'ok');
}

/* 分支操作 */
function branchFrom(s, msgId) {
  const names = new Set(s.branches.map(b => b.name));
  let n = 1; while (names.has('分支 ' + n)) n++;
  const b = { id: uid(), name: '分支 ' + n, tipId: msgId || activeBranch(s).tipId, createdAt: Date.now() };
  s.branches.push(b);
  s.activeBranchId = b.id;
  persistSession(s);
  renderAll();
  toast(`🌱 已开启「${b.name}」，从这里可以走向不同的剧情`, 'ok');
}
function branchSheet(s, branchId) {
  const b = s.branches.find(x => x.id === branchId);
  if (!b) return;
  sheet('分支「' + b.name + '」', [
    { icon: '✎', label: '重命名分支', value: 'rename' },
    { icon: '🗑', label: '删除该分支', value: 'del', danger: true },
  ]).then(async v => {
    if (v === 'rename') {
      const name = await promptDialog('分支名称：', b.name, { title: '重命名分支' });
      if (name && name.trim()) { b.name = name.trim().slice(0, 16); await persistSession(s); renderTopbar(); renderBranchBar(); }
    } else if (v === 'del') {
      if (s.branches.length <= 1) { toast('至少保留一个分支', 'warn'); return; }
      const ok = await confirmDialog(`删除分支「${esc(b.name)}」？仅该分支独有的消息会被删除。`, { danger: true, okText: '删除' });
      if (!ok) return;
      s.branches = s.branches.filter(x => x.id !== branchId);
      if (s.activeBranchId === branchId) s.activeBranchId = s.branches[0].id;
      gc(s);
      await persistSession(s);
      renderAll();
      toast('分支已删除', 'ok');
    }
  });
}

/* 消息操作 */
async function deleteMessage(s, id) {
  const node = s.messages[id]; if (!node) return;
  if (S.streaming && activeBranch(s).tipId === id) { toast('正在生成中，请先停止', 'warn'); return; }
  const sub = new Set(); const st = [id];
  while (st.length) { const x = st.pop(); if (sub.has(x)) continue; sub.add(x); for (const k in s.messages) if (s.messages[k].parentId === x) st.push(k); }
  const parentId = node.parentId || null;
  const fallback = parentId && s.messages[parentId] ? parentId : null;
  const affected = s.branches.filter(b => sub.has(b.tipId));
  let msg = `删除这条消息${sub.size > 1 ? `及其后面的 ${sub.size - 1} 条回复` : ''}？`;
  if (affected.length > 1) msg += `${affected.length} 个以此结尾的分支会回退到上一条消息（分支本身保留）。`;
  const ok = await confirmDialog(msg, { danger: true, okText: '删除' });
  if (!ok) return;
  /* 所有 tip 落在删除子树内的分支：回退到被删消息的父节点，分支保留 */
  for (const b of s.branches) {
    if (sub.has(b.tipId)) b.tipId = fallback;
  }
  for (const k of sub) delete s.messages[k];
  gc(s);
  await persistSession(s);
  renderAll();
}

function editMessage(s, id) {
  const node = s.messages[id]; if (!node) return;
  /* 编辑态单例：先关闭其他已打开的编辑框，避免多个编辑区互相干扰 */
  if (document.querySelector('.edit-area')) { renderChat(); }
  const refs = getMsgRefs(id); if (!refs) return;
  const old = contentOf(node);
  const hasChildren = Object.values(s.messages).some(m => m.parentId === id);
  refs.md.innerHTML = `<textarea class="ipt edit-area">${esc(old)}</textarea>
    <div class="edit-btns"><button class="btn primary sm" data-eact="save">保存</button><button class="btn ghost sm" data-eact="cancel">取消</button></div>`;
  const ta = $('.edit-area', refs.md);
  ta.focus(); ta.style.height = Math.min(ta.scrollHeight, 300) + 'px';
  ta.oninput = () => { ta.style.height = Math.min(ta.scrollHeight, 300) + 'px'; };
  $('.edit-btns', refs.md).onclick = async e => {
    const act = e.target.dataset.eact;
    if (act === 'cancel') { refs.md.innerHTML = MD.render(old); return; }
    if (act === 'save') {
      const v = ta.value.trim();
      if (!v) { toast('内容不能为空', 'warn'); return; }
      if (hasChildren) {
        const ok = await confirmDialog('此消息之后已有回复，修改后这些回复不会自动更新。继续保存？', { okText: '保存' });
        if (!ok) { refs.md.innerHTML = MD.render(old); return; }
      }
      node.content = v;
      if (node.variants && node.variants[node.activeVariant]) node.variants[node.activeVariant].content = v;
      await persistSession(s);
      renderChat(); updateCtxBar();
      toast('已保存', 'ok');
    }
  };
}

/* ================= 参数控件 ================= */
function rangeRow(label, min, max, step, get, set, fmt) {
  const row = document.createElement('div'); row.className = 'pc-row';
  row.innerHTML = `<div class="pc-head"><span>${label}</span><b class="pc-val"></b></div>
    <input type="range" min="${min}" max="${max}" step="${step}">`;
  const r = $('input', row), v = $('.pc-val', row);
  const upd = () => { v.textContent = (fmt || (x => x))(parseFloat(r.value)); };
  r.value = get(); upd();
  r.addEventListener('input', () => { set(parseFloat(r.value)); upd(); });
  return row;
}
function toggleRow(label, get, set, hint) {
  const row = document.createElement('label'); row.className = 'pc-toggle';
  row.innerHTML = `<div><span>${label}</span>${hint ? `<i class="pc-hint">${hint}</i>` : ''}</div>
    <span class="switch"><input type="checkbox" ${get() ? 'checked' : ''}><i></i></span>`;
  $('input', row).addEventListener('change', e => set(e.target.checked));
  return row;
}
function thinkingRow(get, set) {
  const row = document.createElement('div'); row.className = 'pc-row';
  const val = get() || 'off';
  const isCustom = /^\d+$/.test(String(val));
  row.innerHTML = `<div class="pc-head"><span>思考预算（推理深度）</span></div>
    <div class="pc-inline">
      <select class="ipt sel">
        <option value="off" ${val === 'off' ? 'selected' : ''}>关闭</option>
        <option value="low" ${val === 'low' ? 'selected' : ''}>低（约 2K）</option>
        <option value="medium" ${val === 'medium' ? 'selected' : ''}>中（约 8K）</option>
        <option value="high" ${val === 'high' ? 'selected' : ''}>高（约 16K+）</option>
        <option value="custom" ${isCustom ? 'selected' : ''}>自定义 tokens</option>
      </select>
      <input type="number" class="ipt num ${isCustom ? '' : 'hidden'}" min="1024" step="256" value="${isCustom ? val : 4096}">
    </div>
    <i class="pc-hint">支持模型自动映射：Claude 用 thinking budget；Gemini 用 thinkingBudget；GPT-5/o 系列映射为推理力度；GLM/Qwen 自动开关思考。不支持的模型会忽略。</i>`;
  const sel = $('select', row), num = $('.num', row);
  sel.addEventListener('change', () => {
    num.classList.toggle('hidden', sel.value !== 'custom');
    if (sel.value === 'custom') set(String(clamp(parseInt(num.value, 10) || 4096, 1024, 131072)));
    else set(sel.value);
  });
  num.addEventListener('change', () => { if (sel.value === 'custom') set(String(clamp(parseInt(num.value, 10) || 4096, 1024, 131072))); });
  return row;
}
function paramControls(p, onChange) {
  const box = document.createElement('div'); box.className = 'pc-box';
  const upd = () => onChange && onChange();
  box.appendChild(rangeRow('温度（越高越随机）', 0, 2, 0.05, () => p.temperature, v => { p.temperature = v; upd(); }, v => v.toFixed(2)));
  box.appendChild(rangeRow('Top-P（核采样）', 0, 1, 0.01, () => p.topP, v => { p.topP = v; upd(); }, v => v.toFixed(2)));
  box.appendChild(rangeRow('最大回复长度（tokens）', 16, 32768, 16, () => p.maxTokens, v => { p.maxTokens = Math.round(v); upd(); }, v => Math.round(v)));
  box.appendChild(rangeRow('上下文长度（tokens）', 1024, 200000, 1024, () => p.contextTokens, v => { p.contextTokens = Math.round(v); upd(); }, v => Math.round(v)));
  box.appendChild(rangeRow('频率惩罚（减少高频词重复）', -2, 2, 0.1, () => p.freqPenalty, v => { p.freqPenalty = v; upd(); }, v => v.toFixed(1)));
  box.appendChild(rangeRow('存在惩罚（减少重复话题）', -2, 2, 0.1, () => p.presPenalty, v => { p.presPenalty = v; upd(); }, v => v.toFixed(1)));
  box.appendChild(thinkingRow(() => p.thinking, v => { p.thinking = v; upd(); }));
  box.appendChild(toggleRow('流式输出（逐字显示）', () => p.stream !== false, v => { p.stream = v; upd(); }, 'Gemini 默认非流式以降低被内容过滤拦截的概率'));
  box.appendChild(toggleRow('🛡️ 破甲（防截断/拦截）', () => p.antiCensor !== false, v => { p.antiCensor = v; upd(); }, '注入一段安全创作提示，帮助剧情以更艺术化的方式表达，降低被过滤截断的概率'));
  return box;
}

          ${c.opening ? `<div class="card-open">💬 ${esc(c.opening).slice(0, 50)}…</div>` : ''}
        </div>
        <div class="card-ops">
          <button class="icon-btn" data-act="use" title="${sUsing(c.id) ? '正在使用' : '使用'}">${sUsing(c.id) ? '●' : '▶'}</button>

  }
  function avText(c) {
    const ch = (c && c.name) ? c.name[0] : '?';
    return esc(ch) ;
  }
  function sUsing(id) { const s = current(); return !!(s && s.cardId === id); }
  render();

  $('#ccSearch', body).oninput = U.debounce(e => { cardFilter = e.target.value; render(); }, 200);
  $('#ccRandom', body).onclick = () => openCardGenerator('random', { topic: '', ident: '' }, render);
  $('#ccPrompt', body).onclick = () => openCardGenerator('prompt', {}, render);
  $('#ccManual', body).onclick = () => openCardEditor(Cards.blanks(), render);

}

/* 使用角色卡：组装 systemPrompt，可发开场白 */
async function applyCard(card, withOpening, closeModal) {
  let s = current();
  /* 若当前会话已有实质内容，询问用户：应用到当前 还是 新建对话 */
  if (s && (s.rounds || 0) > 0 && !s.cardId) {
    const target = await new Promise(res => {
      const m = modal({
        title: '🎭 使用角色卡',
        body: `<p>当前对话已有内容。要将「${esc(card.name)}」应用到：</p>`,
        actions: [
          { label: '当前对话', cls: 'ghost', onClick: mm => { mm.close(); res('cur'); } },
          { label: '新建对话', cls: 'primary', onClick: mm => { mm.close(); res('new'); } },
          { label: '取消', cls: 'ghost', onClick: mm => { mm.close(); res(null); } },
        ],
      });
    });
    if (target === 'new') { newChat(); s = current(); }
    else if (target === null) { if (closeModal) closeModal.close(); return; }
  }
  if (!s) { s = newChat(); }
  s.cardId = card.id;
  s.systemPrompt = Cards.toSystemPrompt(card);
  await persistSession(s);
  renderAll(); renderTopbar(); renderSidebar();
  toast(`🎭 已应用角色「${card.name}」，可到「🎛️ 参数」微调人设`, 'ok');
  if (closeModal) closeModal.close();
  if (withOpening && card.opening) {
    await sendOpeningAsAI(s, card.opening);
  }
}

async function sendOpeningAsAI(s, text) {
  const br = activeBranch(s);
  const node = { id: uid(), parentId: br.tipId || null, role: 'assistant', content: text, opened: true, createdAt: Date.now() };
  s.messages[node.id] = node;
  br.tipId = node.id;
  await persistSession(s);
  renderChat(); renderSidebar();
}
